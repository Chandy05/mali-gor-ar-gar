<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมหรรษา พยัญชนะ 44 ตัว และสระไทย</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --purple: #9B5DE5;
            --blue: #00BBF9;
            --green: #2ED573;
            --dark: #2C3E50;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Mali', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: var(--dark);
        }

        header {
            width: 100%;
            max-width: 960px;
            padding: 12px 15px 5px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .game-title {
            margin: 0;
            font-size: 1.55rem;
            color: #FF4757;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
        }

        .utility-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .util-btn {
            padding: 7px 12px;
            border: 3px solid var(--white);
            border-radius: 18px;
            font-family: 'Mali', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .util-btn.active-toggle {
            background: #FFEAA7;
            border-color: #FDCB6E;
        }

        .util-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.12);
        }

        .level-nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        @media (min-width: 700px) {
            .level-nav {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .level-btn {
            padding: 10px 12px;
            border: 4px solid var(--white);
            border-radius: 20px;
            font-family: 'Mali', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
        }

        .level-btn:active, .level-btn.active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
            border-color: var(--accent);
            outline: 3px solid #FF4757;
        }

        .btn-lv1 { background-color: #FF6B6B; }
        .btn-lv2 { background-color: #4ECDC4; }
        .btn-lv3 { background-color: #FF9F1C; }
        .btn-lv4 { background-color: #9B5DE5; }

        /* Stage Container */
        .stage-container {
            width: 95%;
            max-width: 920px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            border: 6px solid var(--white);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 18px;
            margin: 8px 0 30px 0;
            min-height: 470px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .mode-switch {
            display: flex;
            background: #F1F2F6;
            border-radius: 18px;
            padding: 5px;
            gap: 4px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 7px 13px;
            border: none;
            border-radius: 14px;
            font-family: 'Mali', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #747D8C;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }

        .score-box {
            font-size: 1.15rem;
            font-weight: 700;
            color: #FFA502;
            background: #FFF9E6;
            padding: 6px 14px;
            border-radius: 18px;
            border: 3px solid #FFEAA7;
        }

        .instruction-bar {
            background: #FFEAA7;
            color: var(--dark);
            padding: 10px 18px;
            border-radius: 22px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #FDCB6E;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .instruction-bar:active {
            transform: scale(0.98);
        }

        /* Single Flashcard View */
        .single-card-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
            padding: 5px 0;
            animation: fadeIn 0.2s ease-out;
        }

        .card-progress {
            background: #F1F2F6;
            color: #57606F;
            padding: 4px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .flashcard-box {
            width: 100%;
            max-width: 340px;
            min-height: 265px;
            background: var(--white);
            border: 6px solid #FF6B6B;
            border-radius: 35px;
            box-shadow: 0 12px 0 #FF6B6B, 0 18px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background-color 0.2s;
            position: relative;
        }

        .flashcard-box.vowel-theme {
            border-color: #00A8FF;
            box-shadow: 0 12px 0 #00A8FF, 0 18px 30px rgba(0,0,0,0.12);
        }

        .flashcard-box:active, .flashcard-box.speaking {
            transform: translateY(6px) scale(1.02);
            background: #FFF9E6;
            border-color: #FFA502;
            box-shadow: 0 6px 0 #FFA502;
        }

        .flashcard-char {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1.05;
            color: var(--dark);
        }

        .flashcard-char.no-img-mode {
            font-size: 7.8rem;
            margin: 15px 0;
        }

        .flashcard-emoji {
            font-size: 4.5rem;
            margin: 6px 0;
        }

        .flashcard-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 6px;
        }

        .flashcard-sub {
            font-size: 1.05rem;
            font-weight: 700;
            color: #747D8C;
            margin-top: 4px;
        }

        /* Grid View */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding: 5px 0;
        }

        @media (min-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .char-card {
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 22px;
            padding: 12px 8px;
            min-height: 145px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #70A1FF;
            transition: transform 0.15s, border-color 0.2s;
            position: relative;
        }

        .char-card:active, .char-card.speaking {
            transform: translateY(4px) scale(1.03);
            border-color: var(--primary);
            background: #FFF5F5;
            box-shadow: 0 2px 0 var(--primary);
        }

        .char-big {
            font-size: 3.4rem;
            font-weight: 700;
            line-height: 1.1;
            color: var(--dark);
        }

        .char-big.no-img-mode {
            font-size: 4.4rem;
            margin: 8px 0;
        }

        .char-emoji {
            font-size: 2.4rem;
            margin: 4px 0;
        }

        .char-label {
            font-size: 1rem;
            font-weight: 700;
            color: #2C3E50;
            text-align: center;
        }

        /* Level 3 & 4 Equation Box */
        .blend-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            margin-top: 2px;
        }

        .blend-filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 16px;
            border: 2px solid #DFE4EA;
            background: var(--white);
            font-family: 'Mali', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #57606F;
            cursor: pointer;
        }

        .filter-chip.active {
            background: #ECCC68;
            border-color: #FFA502;
            color: var(--dark);
        }

        .equation-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            padding: 16px 10px;
            background: #F8F9FA;
            border-radius: 26px;
            border: 4px dashed #CED6E0;
        }

        .eq-slot {
            min-width: 100px;
            height: 138px;
            padding: 10px 14px;
            background: var(--white);
            border: 5px solid #A4B0BE;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #A4B0BE;
            transition: all 0.25s;
        }

        .eq-slot.consonant-slot { border-color: #FF6B6B; box-shadow: 0 6px 0 #FF6B6B; }
        .eq-slot.vowel-slot { border-color: #4ECDC4; box-shadow: 0 6px 0 #4ECDC4; }
        .eq-slot.result-slot { min-width: 130px; border-color: #FFA502; box-shadow: 0 6px 0 #FFA502; background: #FFFDF0; }

        .eq-slot.highlight {
            transform: scale(1.1) translateY(-5px);
            background: #FFEAA7;
            border-color: #FF4757;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.35);
            z-index: 5;
        }

        .eq-symbol {
            font-size: 2rem;
            font-weight: 700;
            color: #747D8C;
        }

        .slot-main-text {
            font-size: 3.4rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .slot-sub-text {
            font-size: 0.95rem;
            color: #57606F;
            font-weight: 700;
            margin-top: 6px;
            text-align: center;
        }

        .phonetic-banner {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--purple);
            background: #F3E8FF;
            padding: 10px 18px;
            border-radius: 20px;
            border: 3px solid #D8B4FE;
            text-align: center;
            width: 100%;
            cursor: pointer;
        }

        .word-nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            padding: 11px 18px;
            border: none;
            border-radius: 22px;
            font-family: 'Mali', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .btn-speak-all { background: #2ED573; }
        .btn-next { background: #1E90FF; }
        .btn-random { background: #FF9F1C; }
        .btn-prev { background: #747D8C; }

        /* Quiz Mode */
        .quiz-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 18px;
            margin: 5px 0;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-counter {
            background: #ECCC68;
            color: var(--dark);
            padding: 5px 16px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.05rem;
        }

        .sound-prompt-btn {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #FF6B6B;
            border: 5px solid var(--white);
            box-shadow: 0 7px 0 #EE5253, 0 10px 18px rgba(0,0,0,0.15);
            font-size: 3rem;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        .quiz-choices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .choice-card {
            width: 140px;
            height: 160px;
            background: var(--white);
            border: 5px solid #70A1FF;
            border-radius: 26px;
            box-shadow: 0 7px 0 #70A1FF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            padding: 10px;
        }

        .choice-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            box-shadow: 0 7px 0 #FF4757;
            animation: shake 0.4s;
        }

        .transition-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 250px;
            gap: 14px;
            animation: fadeIn 0.25s;
        }

        .transition-emoji {
            font-size: 4.8rem;
            animation: bounce 0.6s infinite;
        }

        .transition-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2ED573;
            text-align: center;
        }

        /* Matching Mode */
        .match-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            animation: fadeIn 0.3s;
        }

        .match-columns {
            display: flex;
            justify-content: center;
            gap: 16px;
            width: 100%;
            max-width: 640px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .match-card {
            height: 82px;
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 20px;
            box-shadow: 0 5px 0 #70A1FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            padding: 5px;
            text-align: center;
        }

        .match-card.selected {
            background: #FFEAA7;
            border-color: #FFA502;
            box-shadow: 0 5px 0 #FFA502;
            transform: scale(1.04);
        }

        .match-card.matched {
            background: #7BED9F;
            border-color: #2ED573;
            box-shadow: 0 3px 0 #2ED573;
            opacity: 0.45;
            pointer-events: none;
            transform: scale(0.95);
        }

        .match-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            animation: shake 0.4s;
        }

        /* Voice Studio Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--white);
            width: 100%;
            max-width: 720px;
            max-height: 85vh;
            border-radius: 26px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #F1F2F6;
            padding-bottom: 10px;
        }

        .modal-body {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .voice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #F8F9FA;
            border-radius: 14px;
            border: 2px solid #DFE4EA;
            flex-wrap: wrap;
            gap: 8px;
        }

        .voice-item-title { font-size: 1rem; font-weight: 700; }
        .voice-controls { display: flex; gap: 6px; align-items: center; }

        .rec-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-family: 'Mali', sans-serif;
            font-weight: 700;
            cursor: pointer;
            color: var(--white);
            font-size: 0.85rem;
        }

        .rec-btn.record { background: #FF4757; }
        .rec-btn.recording { background: #2ED573; animation: pulse 1s infinite; }
        .rec-btn.play { background: #1E90FF; }
        .rec-btn.delete { background: #747D8C; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <div class="header-top">
            <h1 class="game-title">🎈 พยัญชนะ 44 ตัว & สระหรรษา</h1>
            <div class="utility-btns">
                <button class="util-btn active-toggle" id="btn-toggle-view" onclick="toggleCardViewMode()">
                    🗂️ ดูทีละใบ
                </button>
                <button class="util-btn active-toggle" id="btn-toggle-img" onclick="toggleImages()">
                    🖼️ แสดงรูปภาพ
                </button>
                <button class="util-btn" onclick="openVoiceStudio()">
                    🎙️ อัดเสียง
                </button>
            </div>
        </div>
        <nav class="level-nav">
            <button class="level-btn btn-lv1 active" onclick="selectLevel(1)">🐣 1. พยัญชนะ (44 ตัว)</button>
            <button class="level-btn btn-lv2" onclick="selectLevel(2)">🌈 2. สระไทยครบชุด</button>
            <button class="level-btn btn-lv3" onclick="selectLevel(3)">🧩 3. ผสมพยัญชนะ+สระ</button>
            <button class="level-btn btn-lv4" onclick="selectLevel(4)">🚂 4. สะกดคำ (กอ-อา-กา)</button>
        </nav>
    </header>

    <main class="stage-container">
        <div class="top-bar">
            <div class="mode-switch">
                <button class="mode-btn active" id="btn-mode-learn" onclick="setMode('learn')">📖 โหมดเรียนรู้</button>
                <button class="mode-btn" id="btn-mode-match" onclick="setMode('match')">🧩 โหมดจับคู่</button>
                <button class="mode-btn" id="btn-mode-quiz" onclick="setMode('quiz')">🎮 โหมดทายเสียง</button>
            </div>
            <div class="score-box">⭐ ดาวคนเก่ง: <span id="star-count">0</span></div>
        </div>

        <div class="instruction-bar" onclick="repeatInstruction()">
            <span>🔊</span> <span id="instruction-text">แตะที่กล่องบัตรคำ เพื่อฟังเสียงพยัญชนะนะจ๊ะ!</span>
        </div>

        <div id="game-content" style="width: 100%; display: flex; justify-content: center;"></div>
    </main>

    <!-- Modal สตูดิโออัดเสียงผู้ปกครอง -->
    <div class="modal-overlay" id="voice-modal">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <h2 style="margin:0; font-size:1.3rem; color:#FF4757;">🎙️ สตูดิโออัดเสียงผู้ปกครอง</h2>
                    <small style="color:#57606F;">คำไหนที่มีการอัดเสียงไว้ เกมจะใช้เสียงที่อัดแทนเสียง AI อัตโนมัติครับ</small>
                </div>
                <button class="util-btn" onclick="closeVoiceStudio()">❌ ปิด</button>
            </div>
            <div class="modal-body" id="voice-studio-list"></div>
        </div>
    </div>

            };
        }

        /* ==================== 4. สถานะของเกม & ระบบสุ่มคำแบบไล่ระดับ ==================== */
        let currentLevel = 1;
        let currentMode = 'learn';
        let singleCardMode = true;
        let showImages = true;
        let stars = 0;

        let currentConsonantIndex = 0;
        let currentVowelIndex = 0;

        // ระบบสุ่มคำสำหรับด่าน 3 และ 4
        let blendPoolMode = 'easy'; // 'easy' (คำง่ายมีความหมาย) หรือ 'free' (สุ่มอิสระทุกพยัญชนะ+สระ)
        let blendHistory = [];
        let blendHistoryIndex = -1;
        let easyWordsGeneratedCount = 0;

        let quizQuestionNumber = 1;
        let currentInstructionTts = 'แตะที่กล่องบัตรคำ เพื่อฟังเสียงพยัญชนะนะจ๊ะ';
        let activeTimers = [];

        function clearAllTimers() {
            activeTimers.forEach(t => clearTimeout(t));
            activeTimers = [];
        }

        // สุ่มคำใหม่โดยเริ่มจากคำง่ายๆ ก่อน (Tier 1 -> Tier 2 -> Tier 3)
        function generateRandomBlendWord() {
            const lastWord = blendHistoryIndex >= 0 ? blendHistory[blendHistoryIndex].word : '';

            if (blendPoolMode === 'easy') {
                let maxTier = 1;
                if (easyWordsGeneratedCount >= 5) maxTier = 2;
                if (easyWordsGeneratedCount >= 12) maxTier = 3;

                let candidates = curatedBlendWords.filter(w => w.tier <= maxTier && w.word !== lastWord);
                if (candidates.length === 0) candidates = curatedBlendWords;

                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                easyWordsGeneratedCount++;
                return buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
            } else {
                // สุ่มอิสระจากพยัญชนะ + สระ
                const cPool = consonants.filter(c => c.easy);
                const vPool = vowels.filter(v => v.easy);
                const cObj = cPool[Math.floor(Math.random() * cPool.length)];
                const vObj = vPool[Math.floor(Math.random() * vPool.length)];

                // เช็คว่าตรงกับคำที่มีรูปภาพในคลังไหม
                const matchCurated = curatedBlendWords.find(w => w.cChar === cObj.char && w.vId === vObj.id);
                if (matchCurated) {
                    return buildBlendObject(cObj, vObj, matchCurated.meaning, matchCurated.emoji);
                }
                return buildBlendObject(cObj, vObj, `ฝึกสะกดคำ`, cObj.emoji);
            }
        }

        function ensureInitialBlendWord() {
            if (blendHistory.length === 0) {
                // คำแรกสุดเริ่มด้วยคำง่ายจาก Tier 1 เสมอ
                const firstWord = generateRandomBlendWord();
                blendHistory.push(firstWord);
                blendHistoryIndex = 0;
            }
        }

        function setBlendPoolMode(mode) {
            playPopSound();
            stopAllSpeech();
            blendPoolMode = mode;
            const nextW = generateRandomBlendWord();
            blendHistory.push(nextW);
            blendHistoryIndex = blendHistory.length - 1;
            renderStage();
        }

        function toggleCardViewMode() {
            playPopSound();
            stopAllSpeech();
            singleCardMode = !singleCardMode;
            const btn = document.getElementById('btn-toggle-view');
            if (singleCardMode) {
                btn.innerHTML = '🗂️ ดูทีละใบ';
                btn.classList.add('active-toggle');
            } else {
                btn.innerHTML = '🪟 ดูตารางรวม';
                btn.classList.remove('active-toggle');
            }

        }

        function toggleImages() {
            playPopSound();
            showImages = !showImages;
            const btn = document.getElementById('btn-toggle-img');
            if (showImages) {
                btn.innerHTML = '🖼️ แสดงรูปภาพ';
                btn.classList.add('active-toggle');
            } else {
                btn.innerHTML = '🙈 ซ่อนรูปภาพ';
                btn.classList.remove('active-toggle');

            renderStage();
        }

        /* ==================== 5. ระบบฐานข้อมูลเสียงผู้ปกครอง (IndexedDB) ==================== */
        let db;
        const recordedKeys = new Set();

        function initDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('ThaiKidsVoiceDB', 1);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('voices')) {
                        database.createObjectStore('voices');
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    loadRecordedKeys().then(resolve);
                };
                request.onerror = () => resolve();
            });
        }

        function loadRecordedKeys() {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction('voices', 'readonly');
                const store = tx.objectStore('voices');
                const req = store.getAllKeys();
                req.onsuccess = () => {
                    recordedKeys.clear();
                    req.result.forEach(k => recordedKeys.add(k));
                    resolve();
                };
                req.onerror = () => resolve();
            });
        }

        function saveVoiceBlob(key, blob) {
            return new Promise((resolve) => {
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').put(blob, key);
                tx.oncomplete = () => {
                    recordedKeys.add(key);
                    resolve();
                };
            });
        }

        function getVoiceBlob(key) {
            return new Promise((resolve) => {
                if (!db || !recordedKeys.has(key)) return resolve(null);
                const tx = db.transaction('voices', 'readonly');
                const req = tx.objectStore('voices').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        function deleteVoiceBlob(key) {
            return new Promise((resolve) => {
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').delete(key);
                tx.oncomplete = () => {
                    recordedKeys.delete(key);
                    resolve();
                };
            });
        }

        /* ==================== 6. ระบบเสียงพูด Natural AI + เล่นเสียงอัด ==================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let currentAudioElement = null;
        let speechSessionId = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playTone(freq, type = 'sine', duration = 0.16, delay = 0) {
            initAudio();
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay * 1000);
        }

        function playPopSound() { playTone(520, 'sine', 0.08); }
        function playSuccessSound() {
            playTone(523.25, 'triangle', 0.14, 0);
            playTone(659.25, 'triangle', 0.14, 0.11);
            playTone(783.99, 'triangle', 0.14, 0.22);
            playTone(1046.50, 'triangle', 0.3, 0.33);
        }
        function playWrongSound() {
            playTone(280, 'sawtooth', 0.18, 0);
            playTone(210, 'sawtooth', 0.25, 0.16);
        }

        function stopAllSpeech() {
            speechSessionId++;
            clearAllTimers();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (currentAudioElement) {
                currentAudioElement.pause();
                currentAudioElement = null;
            }
        }

        function getBestThaiVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices();
            const thVoices = voices.filter(v => v.lang.includes('th') || v.lang.includes('TH'));
            if (thVoices.length === 0) return null;

            return thVoices.find(v => v.name.includes('Premwadee') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Niwat') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Premwadee')) ||
                   thVoices.find(v => v.name.includes('Kanya')) ||
                   thVoices.find(v => v.name.includes('Google')) ||
                   thVoices[0];
        }

        async function speakSmart(voiceKey, ttsText, callback) {
            stopAllSpeech();
            const mySession = speechSessionId;
            let callbackCalled = false;

            const safeCallback = () => {
                if (!callbackCalled && mySession === speechSessionId) {
                    callbackCalled = true;
                    if (callback) callback();
                }
            };

            if (voiceKey && recordedKeys.has(voiceKey)) {
                const blob = await getVoiceBlob(voiceKey);
                if (blob && mySession === speechSessionId) {
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    currentAudioElement = audio;
                    audio.onended = () => {
                        URL.revokeObjectURL(url);
                        safeCallback();
                    };
                    audio.onerror = () => safeCallback();
                    audio.play().catch(() => safeCallback());
                    return;
                }
            }

            if (!('speechSynthesis' in window)) {
                const t = setTimeout(safeCallback, 800);
                activeTimers.push(t);
                return;
            }

            const utter = new SpeechSynthesisUtterance(ttsText);
            utter.lang = 'th-TH';
            utter.rate = 0.92;
            utter.pitch = 1.0;

            const bestVoice = getBestThaiVoice();
            if (bestVoice) utter.voice = bestVoice;

            utter.onend = () => safeCallback();
            utter.onerror = () => safeCallback();

            window.speechSynthesis.speak(utter);
        }

        /* ==================== 7. ระบบควบคุมหน้าจอ ==================== */
        function selectLevel(lv) {
            playPopSound();
            stopAllSpeech();
            currentLevel = lv;

            if (lv === 3 || lv === 4) {

                else if (currentLevel === 4) renderLevel3And4Learn(container, 4);
            } else if (currentMode === 'match') {
                renderMatchGame(container);

        /* ==================== 8. โหมดเรียนรู้: ด่าน 1 & 2 (ไม่รันเสียงอัตโนมัติเมื่อกดเลื่อน) ==================== */

        function renderLevel2Learn(container) {
            setInstruction('แตะที่กล่องบัตรสระ เพื่อฟังเสียงอ่านจ้า', 'แตะที่กล่องบัตรสะ-ระ เพื่อฟังเสียงอ่านจ้า');

                    </div>

            } else {

        function speakCurrentFlashcard(lv) {

                speakSmart(item.id, item.tts, () => box.classList.remove('speaking'));
            } else {
                const item = vowels[currentVowelIndex];
                speakSmart(item.id, item.tts, () => box.classList.remove('speaking'));
            }
        }

        function stepFlashcard(lv, dir) {
            playPopSound();
            stopAllSpeech();
            if (lv === 1) {
                currentConsonantIndex = (currentConsonantIndex + dir + consonants.length) % consonants.length;
            } else {
                currentVowelIndex = (currentVowelIndex + dir + vowels.length) % vowels.length;
            }
            renderStage();
        }

        /* ==================== 9. ด่าน 3 และ 4 (สุ่มคำผสมไล่ระดับความง่าย & ไม่รันเสียงอัตโนมัติ) ==================== */
        function renderLevel3And4Learn(container, lv) {

                    'แตะที่กล่องเพื่อฟังเสียงผสมคำ เช่น ตอ เต่า สะ-ระ อา อ่านว่า ตอ อา ตา'

        function speakSinglePart(part) {
            playPopSound();
            const item = blendHistory[blendHistoryIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            const slotW = document.getElementById('slot-w');
            if (!slotC || !slotV || !slotW) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');
            slotW.classList.remove('highlight');

            if (part === 'c') {
                slotC.classList.add('highlight');
                const txt = currentLevel === 3 ? item.cTts : item.cSound;
                speakSmart(null, txt, () => slotC.classList.remove('highlight'));
            } else if (part === 'v') {
                slotV.classList.add('highlight');
                const txt = currentLevel === 3 ? item.vTts : item.vSound;
                speakSmart(null, txt, () => slotV.classList.remove('highlight'));
            }
        }

        function playBlendEquation() {
            playPopSound();
            const item = blendHistory[blendHistoryIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            const slotW = document.getElementById('slot-w');
            if (!slotC || !slotV || !slotW) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');
            slotW.classList.remove('highlight');

            const voiceKey = currentLevel === 3 ? `${item.id}_lv3` : `${item.id}_lv4`;

            const fullTts = currentLevel === 3
                ? `${item.cTts}, ${item.vTts}, อ่านว่า, ${item.cSound} ${item.vSound} ${item.word}`
                : `${item.cSound}, ${item.vSound}, ${item.word}`;

            const t1 = currentLevel === 3 ? 950 : 600;
            const t2 = currentLevel === 3 ? 1950 : 1200;

            slotC.classList.add('highlight');

            speakSmart(voiceKey, fullTts, () => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.remove('highlight');
            });

            activeTimers.push(setTimeout(() => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.add('highlight');
            }, t1));

            activeTimers.push(setTimeout(() => {
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.add('highlight');
            }, t2));
        }

        function stepBlendWord(dir) {
            playPopSound();
            stopAllSpeech();

            if (dir < 0) {
                if (blendHistoryIndex > 0) {
                    blendHistoryIndex--;
                } else {
                    const prevW = generateRandomBlendWord();
                    blendHistory.unshift(prevW);
                    blendHistoryIndex = 0;
                }
            } else {
                if (blendHistoryIndex < blendHistory.length - 1) {
                    blendHistoryIndex++;
                } else {
                    const nextW = generateRandomBlendWord();
                    blendHistory.push(nextW);
                    blendHistoryIndex = blendHistory.length - 1;
                }
            }
            renderStage();
        }

        /* ==================== 10. โหมดจับคู่ ==================== */
        let selectedLeft = null;
        let selectedRight = null;
        let matchedPairsCount = 0;

        function renderMatchGame(container) {
            selectedLeft = null;
            selectedRight = null;
            matchedPairsCount = 0;

            let pool = [];
            if (currentLevel === 1) {
                setInstruction('🧩 แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ', 'แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ');
                pool = [...consonants].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.char, rightText: `${x.emoji} ${x.name}`, ttsLeft: x.sound, ttsMatch: x.tts
                }));
            } else if (currentLevel === 2) {
                setInstruction('🧩 จับคู่รูปสระ กับชื่อสระให้ถูกต้องนะจ๊ะ', 'จับคู่รูปสะ-ระ กับชื่อสะ-ระให้ถูกต้องนะจ๊ะ');
                pool = [...vowels].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.display, rightText: x.name, ttsLeft: x.sound, ttsMatch: x.tts
                }));
            } else {
                setInstruction('🧩 จับคู่คำอ่าน กับรูปภาพความหมายให้ตรงกันจ้า', 'จับคู่คำอ่าน กับรูปภาพความหมายให้ตรงกันจ้า');
                const randomCurated = [...curatedBlendWords].sort(() => 0.5 - Math.random()).slice(0, 4);
                pool = randomCurated.map(pick => {
                    const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                    const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                    const b = buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                    return {
                        id: b.id,
                        leftText: b.word,
                        rightText: `${b.emoji} ${b.meaning}`,
                        ttsLeft: `${b.cSound} ${b.vSound} ${b.word}`,
                        ttsMatch: `${b.cSound} ${b.vSound} ${b.word}`
                    };
                });
            }

            const leftItems = [...pool].sort(() => 0.5 - Math.random());
            const rightItems = [...pool].sort(() => 0.5 - Math.random());

            const board = document.createElement('div');
            board.className = 'match-board';

            const cols = document.createElement('div');
            cols.className = 'match-columns';

            const colL = document.createElement('div');
            colL.className = 'match-col';
            const colR = document.createElement('div');
            colR.className = 'match-col';

            leftItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerText = item.leftText;
                card.onclick = () => selectMatchCard('left', card, item);
                colL.appendChild(card);
            });

            rightItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.style.fontSize = '1.25rem';
                card.innerText = item.rightText;
                card.onclick = () => selectMatchCard('right', card, item);
                colR.appendChild(card);
            });

            cols.appendChild(colL);
            cols.appendChild(colR);
            board.appendChild(cols);
            container.appendChild(board);
        }

        function selectMatchCard(side, cardEl, item) {
            playPopSound();
            if (side === 'left') {
                if (selectedLeft) selectedLeft.el.classList.remove('selected');
                selectedLeft = { el: cardEl, item };
                cardEl.classList.add('selected');
                speakSmart(null, item.ttsLeft);
            } else {
                if (selectedRight) selectedRight.el.classList.remove('selected');
                selectedRight = { el: cardEl, item };
                cardEl.classList.add('selected');
            }

            if (selectedLeft && selectedRight) {
                const left = selectedLeft;
                const right = selectedRight;
                selectedLeft = null;
                selectedRight = null;

                if (left.item.id === right.item.id) {
                    left.el.classList.remove('selected');
                    right.el.classList.remove('selected');
                    left.el.classList.add('matched');
                    right.el.classList.add('matched');
                    playSuccessSound();
                    matchedPairsCount++;

                    speakSmart(left.item.id, left.item.ttsMatch, () => {
                        if (matchedPairsCount === 4) {
                            addStar();
                            showTransitionScreen('จับคู่ครบแล้ว เก่งมากจ้า!', () => {
                                renderMatchGame(document.getElementById('game-content'));
                            });
                        }
                    });
                } else {
                    left.el.classList.add('wrong');
                    right.el.classList.add('wrong');
                    playWrongSound();
                    setTimeout(() => {
                        left.el.classList.remove('selected', 'wrong');
                        right.el.classList.remove('selected', 'wrong');
                    }, 500);
                }
            }
        }

        /* ==================== 11. โหมดทายเสียง (ขึ้นทีละข้อ ล้างของเก่าก่อนขึ้นข้อใหม่) ==================== */
        function renderQuiz(container) {
            container.innerHTML = '';

            let choices = [];
            let answer = null;
            let displayQuestion = '';
            let ttsQuestion = '';
            let voiceKeyToUse = null;

            if (currentLevel === 1) {
                choices = [...consonants].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else if (currentLevel === 2) {
                choices = [...vowels].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else {
                const pickedRaw = [...curatedBlendWords].sort(() => 0.5 - Math.random()).slice(0, 3);
                choices = pickedRaw.map(pick => {
                    const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                    const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                    return buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                });
                answer = choices[Math.floor(Math.random() * choices.length)];

                if (currentLevel === 3) {
                    displayQuestion = `ข้อที่ ${quizQuestionNumber}: ${answer.cName} ${answer.vName} อ่านว่า ${answer.cSound} ${answer.vSound} ${answer.word}`;
                    ttsQuestion = `${answer.cTts}, ${answer.vTts}, อ่านว่า, ${answer.cSound} ${answer.vSound} ${answer.word}`;
                    voiceKeyToUse = `${answer.id}_lv3`;
                } else {
                    displayQuestion = `ข้อที่ ${quizQuestionNumber}: คำว่า "${answer.cSound} - ${answer.vSound} - ${answer.word}" คือข้อไหนจ๊ะ?`;
                    ttsQuestion = `${answer.cSound}, ${answer.vSound}, ${answer.word}`;
                    voiceKeyToUse = `${answer.id}_lv4`;
                }
            }

            setInstruction(displayQuestion, ttsQuestion);

            const quizWrapper = document.createElement('div');
            quizWrapper.className = 'quiz-area';

            const counterBadge = document.createElement('div');
            counterBadge.className = 'quiz-counter';
            counterBadge.innerText = `🎯 ข้อที่ ${quizQuestionNumber}`;

            const soundBtn = document.createElement('button');
            soundBtn.className = 'sound-prompt-btn';
            soundBtn.innerHTML = '🔊';
            soundBtn.onclick = () => speakSmart(voiceKeyToUse, ttsQuestion);

            const choicesBox = document.createElement('div');
            choicesBox.className = 'quiz-choices';

            choices.forEach(item => {
                const card = document.createElement('div');
                card.className = 'choice-card';

                if (currentLevel === 1) {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}">${item.char}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                } else if (currentLevel === 2) {
                    card.innerHTML = `
                        <div class="char-big" style="color:#00A8FF;">${item.display}</div>
                        ${showImages ? `<div class="char-label" style="margin-top:8px; font-size:0.9rem;">${item.desc}</div>` : ''}
                    `;
                } else {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}" style="color:#2ED573;">${item.word}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                }

                card.onclick = () => handleQuizChoice(card, item, answer);
                choicesBox.appendChild(card);
            });

            quizWrapper.appendChild(counterBadge);
            quizWrapper.appendChild(soundBtn);
            quizWrapper.appendChild(choicesBox);
            container.appendChild(quizWrapper);

            activeTimers.push(setTimeout(() => speakSmart(voiceKeyToUse, ttsQuestion), 300));
        }

        function handleQuizChoice(cardEl, selected, answer) {
            if (selected.id === answer.id) {
                playSuccessSound();
                addStar();
                quizQuestionNumber++;
                showTransitionScreen('ถูกต้องจ้า เก่งมากเลย!', () => {
                    renderQuiz(document.getElementById('game-content'));
                });
            } else {
                if (cardEl.classList.contains('wrong')) return;
                cardEl.classList.add('wrong');
                playWrongSound();
                speakSmart(null, 'ลองดูใหม่อีกทีนะจ๊ะ', () => {
                    setTimeout(() => cardEl.classList.remove('wrong'), 400);
                });
            }
        }

        function showTransitionScreen(message, onComplete) {
            const container = document.getElementById('game-content');
            container.innerHTML = `
                <div class="transition-screen">
                    <div class="transition-emoji">🌟🎉🌟</div>
                    <div class="transition-text">${message}</div>
                </div>
            `;
            speakSmart(null, 'เก่งมากจ้า', () => {
                activeTimers.push(setTimeout(onComplete, 450));
            });
        }

        /* ==================== 12. สตูดิโออัดเสียงผู้ปกครอง ==================== */
        let mediaRecorder = null;
        let audioChunks = [];
        let currentlyRecordingKey = null;

        function getAllRecordableItems() {
            const list = [];
            consonants.forEach(c => list.push({ key: c.id, label: `[พยัญชนะ] ${c.char} - ${c.name}`, defaultTts: c.tts }));
            vowels.forEach(v => list.push({ key: v.id, label: `[สระ] ${v.display} - ${v.name}`, defaultTts: v.tts }));
            curatedBlendWords.forEach(pick => {
                const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                const w = buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                list.push({
                    key: `${w.id}_lv3`,
                    label: `[ด่าน 3] ${w.word} ("${w.cName} ${w.vName} อ่านว่า ${w.cSound} ${w.vSound} ${w.word}")`,
                    defaultTts: `${w.cTts}, ${w.vTts}, อ่านว่า, ${w.cSound} ${w.vSound} ${w.word}`
                });
                list.push({
                    key: `${w.id}_lv4`,
                    label: `[ด่าน 4] ${w.word} ("${w.cSound} ${w.vSound} ${w.word}")`,
                    defaultTts: `${w.cSound}, ${w.vSound}, ${w.word}`
                });
            });
            return list;
        }

        function openVoiceStudio() {
            stopAllSpeech();
            document.getElementById('voice-modal').classList.add('show');
            renderVoiceStudioList();
        }

        function closeVoiceStudio() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            document.getElementById('voice-modal').classList.remove('show');
            renderStage();
        }

        function renderVoiceStudioList() {
            const listEl = document.getElementById('voice-studio-list');
            listEl.innerHTML = '';
            const items = getAllRecordableItems();

            items.forEach(item => {
                const hasRecorded = recordedKeys.has(item.key);
                const isRec = currentlyRecordingKey === item.key;

                const row = document.createElement('div');
                row.className = 'voice-item';
                row.innerHTML = `
                    <div class="voice-item-title">
                        ${hasRecorded ? '✅' : '⚪'} ${item.label}
                    </div>
                    <div class="voice-controls">
                        <button class="rec-btn ${isRec ? 'recording' : 'record'}" onclick="toggleRecord('${item.key}')">
                            ${isRec ? '⏹️ หยุดอัด' : '🎙️ อัดเสียง'}
                        </button>
                        <button class="rec-btn play" onclick="speakSmart('${item.key}', '${item.defaultTts}')">
                            🔊 ฟัง
                        </button>
                        ${hasRecorded ? `<button class="rec-btn delete" onclick="removeRecording('${item.key}')">🗑️ ลบ</button>` : ''}
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        async function toggleRecord(key) {
            if (currentlyRecordingKey === key && mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                currentlyRecordingKey = key;
                renderVoiceStudioList();

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    await saveVoiceBlob(key, blob);
                    stream.getTracks().forEach(t => t.stop());
                    currentlyRecordingKey = null;
                    renderVoiceStudioList();
                };

                mediaRecorder.start();
            } catch (err) {
                alert('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตการใช้ไมโครโฟนบนเบราว์เซอร์ครับ');
                currentlyRecordingKey = null;
                renderVoiceStudioList();
            }
        }

        async function removeRecording(key) {
            await deleteVoiceBlob(key);
            renderVoiceStudioList();
        }

        /* ==================== 13. พลุกระดาษ (CONFETTI) ==================== */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#9B5DE5', '#00BBF9', '#2ED573'];
            for (let i = 0; i < 60; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.8) * 18 - 4,
                    size: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45;
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) confettiParticles.splice(index, 1);
            });

            if (confettiParticles.length > 0) {
                requestAnimationFrame(updateConfetti);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { getBestThaiVoice(); };
        }

        window.onload = async () => {
            await initDB();
            ensureInitialBlendWord();
            renderStage();
        };
    </script>
</body>
