        /* ==================== 14. โหมดทายเสียง ==================== */
        function renderQuiz(container) {
            container.innerHTML = '';

            let choices = [];
            let answer = null;
            let displayQuestion = '';
            let ttsQuestion = '';
            let voiceKeyToUse = null;

            if (currentLevel === 1) {
                choices = [...consonants].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else if (currentLevel === 2) {
                choices = [...vowels].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else if (currentLevel === 5) {
                choices = [...toneSets].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: คำไหนคือคำว่า "${answer.targetWord}" (${answer.sampleWord}) จ๊ะ?`;
                ttsQuestion = `คำไหนคือคำว่า ${answer.targetWord} จ๊ะ`;
            } else if (currentLevel === 6) {
                const allLines = [];
                stories.forEach(s => s.lines.forEach((l, idx) => allLines.push({ id: `${s.id}_line_${idx}`, text: l, emoji: s.emoji })));
                choices = allLines.sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ประโยคไหนอ่านว่า "${answer.text}" จ๊ะ?`;
                ttsQuestion = answer.text.replace(/ /g, '');
                voiceKeyToUse = answer.id;
            } else {
                const pickedRaw = [...curatedBlendWords].sort(() => 0.5 - Math.random()).slice(0, 3);
                choices = pickedRaw.map(pick => {
                    const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                    const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                    return buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                });
                answer = choices[Math.floor(Math.random() * choices.length)];

                if (currentLevel === 3) {
                    displayQuestion = `ข้อที่ ${quizQuestionNumber}: ${answer.cName} ${answer.vName} อ่านว่า ${answer.cSound} ${answer.vSound} ${answer.word}`;
                    ttsQuestion = `${answer.cTts} ${answer.vTts} อ่านว่า ${answer.cSound} ${answer.vSound} ${answer.word}`;
                    voiceKeyToUse = `${answer.id}_lv3`;
                } else {
                    displayQuestion = `ข้อที่ ${quizQuestionNumber}: คำว่า "${answer.cSound} - ${answer.vSound} - ${answer.word}" คือข้อไหนจ๊ะ?`;
                    ttsQuestion = `${answer.cSound} ${answer.vSound} ${answer.word}`;
                    voiceKeyToUse = `${answer.id}_lv4`;
                }
            }

            setInstruction(displayQuestion, ttsQuestion);

            const quizWrapper = document.createElement('div');
            quizWrapper.className = 'quiz-area';

            const counterBadge = document.createElement('div');
            counterBadge.className = 'quiz-counter';
            counterBadge.innerText = `🎯 ข้อที่ ${quizQuestionNumber}`;

            const soundBtn = document.createElement('button');
            soundBtn.className = 'sound-prompt-btn';
            soundBtn.innerHTML = '🔊';
            soundBtn.onclick = () => speakSmart(voiceKeyToUse, ttsQuestion);

            const choicesBox = document.createElement('div');
            choicesBox.className = 'quiz-choices';

            choices.forEach(item => {
                const card = document.createElement('div');
                card.className = 'choice-card';
                card.setAttribute('tabindex', '0');
                card.onkeydown = (e) => { if(e.key === 'Enter') card.click(); };

                if (currentLevel === 1) {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}">${item.char}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                } else if (currentLevel === 2) {
                    card.innerHTML = `
                        <div class="char-big" style="color:#00A8FF;">${item.display}</div>
                        ${showImages ? `<div class="char-label" style="margin-top:8px; font-size:0.88rem;">${item.desc}</div>` : ''}
                    `;
                } else if (currentLevel === 5) {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}" style="color:#F15BB5;">${item.targetWord}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                } else if (currentLevel === 6) {
                    card.style.width = '240px';
                    card.style.minHeight = '105px';
                    card.innerHTML = `
                        <div style="font-size:1.45rem; font-weight:700; color:#2C3E50;">${item.text}</div>
                        ${showImages ? `<div style="font-size:1.6rem; margin-top:4px;">${item.emoji}</div>` : ''}
                    `;

                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}" style="color:#2ED573;">${item.word}</div>

        function encodeImageBase64(inputEl, previewId, pageIdx = -1) {
            const file = inputEl.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('กรุณาเลือกไฟล์รูปภาพ');
                inputEl.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = event => {
                if (typeof event.target.result !== 'string') {
                    alert('อ่านไฟล์รูปภาพไม่สำเร็จ');
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width;
                    let h = img.height;
                    const MAX_WIDTH = 800;
                    if (w > MAX_WIDTH) {
                        h *= MAX_WIDTH / w;
                        w = MAX_WIDTH;
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressed = canvas.toDataURL('image/jpeg', 0.8);

                    const imgEl = document.getElementById(previewId);
                    if (!imgEl) return;
                    imgEl.src = compressed;
                    imgEl.style.display = 'block';
                    imgEl.setAttribute('data-b64', compressed);

                    if (pageIdx === -1) editingCustomStoryCover = compressed;
                    else if (tempCustomStoryPages[pageIdx]) tempCustomStoryPages[pageIdx].img = compressed;
                    window._tempPages = tempCustomStoryPages;
                };
                img.src = event.target.result;
            };
            reader.onerror = () => alert('อ่านไฟล์รูปภาพไม่สำเร็จ');
            reader.readAsDataURL(file);
        }

        async function saveCustomStory(id) {
            const titleInput = document.getElementById('edit-cs-title');
            if (!titleInput) return;
            const title = titleInput.value.trim();
            if (!title) {
                alert('กรุณาตั้งชื่อนิทานด้วยครับ');
                return;
            }

            syncTempInputs();
            if (!tempCustomStoryPages.length) {
                alert('นิทานต้องมีอย่างน้อย 1 หน้านะครับ');
                return;
            }

            const coverEl = document.getElementById('preview-cs-cover');
            const coverB64 = coverEl ? coverEl.getAttribute('data-b64') || coverEl.src || '' : '';
            const storyObj = {
                id,
                title,
                cover: coverB64.startsWith('data:') ? coverB64 : '',
                pages: tempCustomStoryPages.map(p => ({
                    ...p,
                    img: p.img || '',
                    lines: Array.isArray(p.lines) && p.lines.length ? p.lines : [p.text || '']
                }))
            };
            try {
                await saveCustomStoryDB(storyObj);
                alert('💾 บันทึกนิทานเรียบร้อยแล้ว!');
                renderStoryStudioList();
            } catch (error) {
                console.error('Unable to save custom story:', error);
                alert('ระบบแจ้งเตือน (Huawei Debug):\n' + ((error && (error.message || error.name)) || 'Unknown Error') + '\n\nลองลบรูปภาพออกแล้วบันทึกเฉพาะข้อความดูก่อนครับ');
            }
        }

        async function deleteCustomStory(id) {
            if (!confirm('แน่ใจหรือไม่ว่าต้องการลบนิทานเรื่องนี้?')) return;
            try {
                const story = customStories.find(item => item.id === id);
                await deleteCustomStoryDB(id);
                if (currentCustomStoryId === id) {
                    currentCustomStoryId = null;
                    currentCustomStoryPage = 0;
                    renderStage();
                }
                if (story) {
                    const lineKeys = story.pages.flatMap((page, pIdx) => {
                        if (!Array.isArray(page.lines)) return [`cs_${id}_p_${pIdx}`];
                        return page.lines.map((_, lIdx) => `cs_${id}_p_${pIdx}_l_${lIdx}`);
                    });
                    await Promise.all(lineKeys.filter(key => recordedKeys.has(key)).map(deleteVoiceBlob));
                }
                renderStoryStudioList();
            } catch (error) {
                console.error('Unable to delete custom story:', error);
                alert('ลบนิทานไม่สำเร็จ กรุณาลองอีกครั้ง');
            }
        }

        async function toggleRecordStoryPage(key, storyId = editingCustomStoryId) {
            const btn = document.getElementById(`rec-btn-${key}`);
            if (currentlyRecordingKey === key && mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                if (btn) {
                    btn.classList.remove('recording');
                    btn.classList.add('record');
                    btn.innerText = '🎙️ อัดเสียงใหม่';
                }
                setTimeout(() => {
                    syncTempInputs();
                    renderCustomStoryPagesUI(storyId);
                }, 500);
                return;
            }

            if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
                alert('เบราว์เซอร์นี้ไม่รองรับการอัดเสียง กรุณาใช้เบราว์เซอร์ที่รองรับไมโครโฟนครับ');
                return;
            }
            if (currentlyRecordingKey) {
                alert('กรุณาหยุดการอัดเสียงที่กำลังทำงานอยู่ก่อน');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                currentlyRecordingKey = key;
                if (btn) {
                    btn.classList.remove('record');
                    btn.classList.add('recording');
                    btn.innerText = '⏹️ กำลังอัด... (กดเพื่อหยุด)';
                }

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    try {
                        await saveVoiceBlob(key, blob);
                    } catch (error) {
                        console.error('Unable to save story voice recording:', error);
                        alert('บันทึกเสียงพากย์ไม่สำเร็จ กรุณาลองอีกครั้ง');
                    } finally {
                        stream.getTracks().forEach(track => track.stop());
                        currentlyRecordingKey = null;
                        if (mediaRecorder && mediaRecorder.state !== 'recording') mediaRecorder = null;
                        setTimeout(() => {
                            syncTempInputs();
                            renderCustomStoryPagesUI(storyId);
                        }, 150);
                    }
                };
                mediaRecorder.start();
            } catch (err) {
                alert('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาตรวจสอบการอนุญาตบนเบราว์เซอร์ครับ');
            }
        }

        function openVoiceStudio() {
            stopAllSpeech();
            document.getElementById('voice-modal').classList.add('show');
            renderVoiceStudioList();
        }

        function closeVoiceStudio() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            document.getElementById('voice-modal').classList.remove('show');
            renderStage();
        }

        function renderVoiceStudioList() {
            const listEl = document.getElementById('voice-studio-list');
            listEl.innerHTML = '';
            getAllRecordableItems().forEach(item => {
                const hasRecorded = recordedKeys.has(item.key);
                const isRec = currentlyRecordingKey === item.key;
                const row = document.createElement('div');
                row.className = 'voice-item';
                row.innerHTML = `
                    <div class="voice-item-title">${hasRecorded ? '✅' : '⚪'} ${item.label}</div>
                    <div class="voice-controls">
                        <button class="rec-btn ${isRec ? 'recording' : 'record'}" onclick="toggleRecord('${item.key}')">
                            ${isRec ? '⏹️ หยุดอัด' : '🎙️ อัดเสียง'}
                        </button>
                        <button class="rec-btn play" onclick="speakSmart('${item.key}', '${item.defaultTts}')">🔊 ฟัง</button>
                        ${hasRecorded ? `<button class="rec-btn download" onclick="downloadRecording('${item.key}')">💾 ดาวน์โหลด</button>` : ''}
                        ${hasRecorded ? `<button class="rec-btn delete" onclick="removeRecording('${item.key}')">🗑️ ลบ</button>` : ''}
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        async function toggleRecord(key) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
                alert('เบราว์เซอร์นี้ไม่รองรับการอัดเสียงในหน้าเว็บนี้ กรุณาใช้เบราว์เซอร์ที่รองรับไมโครโฟนครับ');
                return;
            }

            if (currentlyRecordingKey === key && mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                currentlyRecordingKey = key;
                renderVoiceStudioList();

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    try {
                        await saveVoiceBlob(key, blob);
                    } catch (error) {
                        console.error('Unable to save voice recording:', error);
                        alert('บันทึกเสียงไม่สำเร็จ กรุณาลองอีกครั้ง');
                    } finally {
                        stream.getTracks().forEach(t => t.stop());
                        currentlyRecordingKey = null;
                        renderVoiceStudioList();
                    }
                };
                mediaRecorder.start();
            } catch (err) {
                alert('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตการใช้ไมโครโฟนบนเบราว์เซอร์ครับ');
                currentlyRecordingKey = null;
                renderVoiceStudioList();
            }
        }

        async function downloadRecording(key) {
            const blob = await getVoiceBlob(key);
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${key}.mp3`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function removeRecording(key) {
            try {
                await deleteVoiceBlob(key);
                renderVoiceStudioList();
            } catch (error) {
                console.error('Unable to delete voice recording:', error);
                alert('ลบเสียงบันทึกไม่สำเร็จ กรุณาลองอีกครั้ง');
            }
        }

        /* ==================== 16. พลุกระดาษ (CONFETTI) ==================== */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#9B5DE5', '#00BBF9', '#2ED573'];
            for (let i = 0; i < 55; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 16 - 4,
                    size: Math.random() * 9 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45;
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) confettiParticles.splice(index, 1);
            });

            if (confettiParticles.length > 0) requestAnimationFrame(updateConfetti);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { getBestThaiVoice(); };
        }

        window.onload = async () => {
            await initDB();
            ensureInitialBlendWord();
            renderStage();

            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('./sw.js');
                    const audioKeys = getAllRecordableItems().map(item => item.key);
                    audioKeys.push('sys_correct', 'sys_wrong');
                    const audioUrls = [...new Set(audioKeys)].map(key =>
                        `audio/${encodeURIComponent(key.normalize('NFC'))}.mp3`
                    );
                    const sendUrlsToCache = () => {
                        if (navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({
                                type: 'CACHE_AUDIO_FILES',
                                urls: audioUrls
                            });
                        }
                    };
                    if (navigator.serviceWorker.controller) {
                        sendUrlsToCache();
                    } else {
                        navigator.serviceWorker.addEventListener('controllerchange', sendUrlsToCache, { once: true });
                    }
                } catch (e) {
                    console.warn('ลงทะเบียน Service Worker ไม่สำเร็จ:', e);
                }
            }
        };
    </script>
