<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมหรรษา พยัญชนะ สระ วรรณยุกต์ และหัดอ่านมานะ-มานี</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#FF6B6B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="เกมหรรษา">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --purple: #9B5DE5;
            --blue: #00BBF9;
            --green: #2ED573;
            --orange: #FF9F1C;
            --pink: #F15BB5;
            --dark: #2C3E50;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Mali', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: var(--dark);
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 10px 14px 4px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .game-title {
            margin: 0;
            font-size: 1.4rem;
            color: #FF4757;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
        }

        .utility-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .util-btn {
            padding: 6px 11px;
            border: 3px solid var(--white);
            border-radius: 16px;
            font-family: 'Mali', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 3px 0 rgba(0,0,0,0.12);
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .util-btn.active-toggle {
            background: #FFEAA7;
            border-color: #FDCB6E;
        }

        .util-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.12);
        }

        .level-nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            width: 100%;
            margin-top: 2px;
        }

        @media (min-width: 680px) {
            .level-nav {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .level-btn {
            padding: 9px 10px;
            border: 3px solid var(--white);
            border-radius: 18px;
            font-family: 'Mali', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 5px;
        }

        .level-btn:active, .level-btn.active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
            border-color: var(--accent);
            outline: 3px solid #FF4757;
        }

        /* Smart TV Focus States */
        button:focus, .util-btn:focus, .level-btn:focus, .action-btn:focus {
            outline: 5px solid #FF9F1C;
            outline-offset: 2px;
            transform: scale(1.05);
        }

        .char-card:focus, .flashcard-box:focus, .choice-card:focus, .tone-step-card:focus, .story-line:focus, .match-card:focus {
            outline: 6px solid #FF9F1C;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .btn-lv1 { background-color: #FF6B6B; }
        .btn-lv2 { background-color: #4ECDC4; }
        .btn-lv3 { background-color: #FF9F1C; }
        .btn-lv4 { background-color: #9B5DE5; }
        .btn-lv5 { background-color: #F15BB5; }
        .btn-lv6 { background-color: #2ED573; }
        .btn-lv7 { background-color: #0984E3; }

        /* Custom Story Styles */
        .bookshelf-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            padding: 10px;
        }
        @media (min-width: 600px) { .bookshelf-grid { grid-template-columns: repeat(3, 1fr); } }

        .custom-book-card {
            background: #FFFDF7;
            border: 4px solid #DDB892;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 #DDB892;
            transition: 0.15s;
        }
        .custom-book-card:active { transform: translateY(4px); box-shadow: 0 2px 0 #DDB892; }
        .custom-book-cover { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; background: #F1F2F6; }
        .custom-book-title { font-weight: 700; color: #9C6644; text-align: center; font-size: 1.1rem; }

        .story-img-preview {
            width: 100%;
            max-width: 400px;
            max-height: 250px;
            object-fit: cover;
            border-radius: 16px;
            border: 4px solid #DFE4EA;
            margin-bottom: 10px;
            background: #F1F2F6;
        }

        .studio-page-block {
            background: #F8F9FA;
            border: 3px dashed #CED6E0;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .studio-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #DFE4EA;
            border-radius: 12px;
            font-family: 'Mali', sans-serif;
            font-size: 1rem;
        }

        .stage-container {
            width: 95%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            border: 5px solid var(--white);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            padding: 16px;
            margin: 6px 0 28px 0;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mode-switch {
            display: flex;
            background: #F1F2F6;
            border-radius: 16px;
            padding: 4px;
            gap: 4px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-family: 'Mali', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #747D8C;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        .score-box {
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFA502;
            background: #FFF9E6;
            padding: 5px 14px;
            border-radius: 16px;
            border: 3px solid #FFEAA7;
        }

        .instruction-bar {
            background: #FFEAA7;
            color: var(--dark);
            padding: 9px 16px;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #FDCB6E;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .instruction-bar:active {
            transform: scale(0.98);
        }

        #game-content {
            width: 100%;
            display: block;
        }

        /* Single Flashcard View */
        .single-card-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            padding: 4px 0;
            animation: fadeIn 0.2s ease-out;
        }

        .card-progress {
            background: #F1F2F6;
            color: #57606F;
            padding: 4px 14px;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .flashcard-box {
            width: 100%;
            max-width: 330px;
            min-height: 250px;
            background: var(--white);
            border: 6px solid #FF6B6B;
            border-radius: 32px;
            box-shadow: 0 10px 0 #FF6B6B, 0 15px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background-color 0.2s;
            position: relative;
        }

        .flashcard-box.vowel-theme {
            border-color: #00A8FF;
            box-shadow: 0 10px 0 #00A8FF, 0 15px 25px rgba(0,0,0,0.1);
        }

        .flashcard-box:active, .flashcard-box.speaking {
            transform: translateY(5px) scale(1.02);
            background: #FFF9E6;
            border-color: #FFA502;
            box-shadow: 0 5px 0 #FFA502;
        }

        .flashcard-char {
            font-size: 5.8rem;
            font-weight: 700;
            line-height: 1.05;
            color: var(--dark);
        }

        .flashcard-char.no-img-mode {
            font-size: 7.4rem;
            margin: 12px 0;
        }

        .flashcard-emoji {
            font-size: 4.2rem;
            margin: 5px 0;
        }

        .flashcard-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 4px;
        }

        .flashcard-sub {
            font-size: 1rem;
            font-weight: 700;
            color: #747D8C;
            margin-top: 4px;
            text-align: center;
        }

        /* Grid View */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding: 4px 0;
        }

        @media (min-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .char-card {
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 22px;
            padding: 12px 8px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #70A1FF;
            transition: transform 0.15s, border-color 0.2s;
        }

        .char-card:active, .char-card.speaking {
            transform: translateY(4px) scale(1.03);
            border-color: var(--primary);
            background: #FFF5F5;
            box-shadow: 0 2px 0 var(--primary);
        }

        .char-big {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.1;
            color: var(--dark);
        }

        .char-big.no-img-mode {
            font-size: 4.2rem;
            margin: 6px 0;
        }

        .char-emoji {
            font-size: 2.3rem;
            margin: 4px 0;
        }

        .char-label {
            font-size: 0.98rem;
            font-weight: 700;
            color: #2C3E50;
            text-align: center;
        }

        /* Level 3 & 4 Equation Box */
        .blend-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
        }

        .blend-filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-chip {
            padding: 6px 13px;
            border-radius: 15px;
            border: 2px solid #DFE4EA;
            background: var(--white);
            font-family: 'Mali', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #57606F;
            cursor: pointer;
        }

        .filter-chip.active {
            background: #ECCC68;
            border-color: #FFA502;
            color: var(--dark);
        }

        .equation-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            padding: 15px 10px;
            background: #F8F9FA;
            border-radius: 24px;
            border: 4px dashed #CED6E0;
        }

        .eq-slot {
            min-width: 96px;
            height: 132px;
            padding: 8px 12px;
            background: var(--white);
            border: 5px solid #A4B0BE;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #A4B0BE;
            transition: all 0.2s;
        }

        .eq-slot.consonant-slot { border-color: #FF6B6B; box-shadow: 0 5px 0 #FF6B6B; }
        .eq-slot.vowel-slot { border-color: #4ECDC4; box-shadow: 0 5px 0 #4ECDC4; }
        .eq-slot.result-slot { min-width: 125px; border-color: #FFA502; box-shadow: 0 5px 0 #FFA502; background: #FFFDF0; }

        .eq-slot.highlight {
            transform: scale(1.08) translateY(-4px);
            background: #FFEAA7;
            border-color: #FF4757;
            box-shadow: 0 8px 18px rgba(255, 71, 87, 0.35);
            z-index: 5;
        }

        .eq-symbol {
            font-size: 1.9rem;
            font-weight: 700;
            color: #747D8C;
        }

        .slot-main-text {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .slot-sub-text {
            font-size: 0.92rem;
            color: #57606F;
            font-weight: 700;
            margin-top: 5px;
            text-align: center;
        }

        .phonetic-banner {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--purple);
            background: #F3E8FF;
            padding: 10px 16px;
            border-radius: 18px;
            border: 3px solid #D8B4FE;
            text-align: center;
            width: 100%;
            cursor: pointer;
        }

        .word-nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .action-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            font-family: 'Mali', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }

        .btn-speak-all { background: #2ED573; }
        .btn-next { background: #1E90FF; }
        .btn-random { background: #FF9F1C; }
        .btn-prev { background: #747D8C; }

        /* Level 5: Tone Marks */
        .tone-marks-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            margin-bottom: 6px;
        }

        .tone-mark-pill {
            background: #FFF0F6;
            border: 3px solid #F15BB5;
            border-radius: 18px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #F15BB5;
            transition: 0.15s;
        }

        .tone-mark-pill:active, .tone-mark-pill.highlight {
            transform: translateY(3px);
            background: #FFEAA7;
        }

        .tone-mark-pill.disabled, .tone-step-card.disabled {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .tone-steps-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            padding: 12px 8px;
            background: #F8F9FA;
            border-radius: 24px;
            border: 3px dashed #CED6E0;
        }

        .tone-step-card {
            background: var(--white);
            border: 4px solid #9B5DE5;
            border-radius: 20px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #9B5DE5;
            transition: 0.2s;
        }

        .tone-step-card.highlight {
            transform: translateY(-6px) scale(1.06);
            background: #FFEAA7;
            border-color: #FF4757;
            box-shadow: 0 8px 15px rgba(255,71,87,0.3);
        }

        .tone-word-big {
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        .tone-label-small {
            font-size: 0.8rem;
            color: #57606F;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Level 6: Story Reader */
        .story-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            animation: fadeIn 0.25s;
        }

        .story-book {
            width: 100%;
            max-width: 680px;
            background: #FFFDF7;
            border: 5px solid #E6CCB2;
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 10px 0 #DDB892, 0 14px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .story-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            border-bottom: 2px dashed #E6CCB2;
            padding-bottom: 8px;
        }

        .story-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #9C6644;
        }

        .story-scene-emoji {
            font-size: 3.4rem;
            background: #F8F4E8;
            padding: 8px 24px;
            border-radius: 20px;
        }

        .story-lines-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .story-line {
            width: 100%;
            background: var(--white);
            border: 3px solid #EDE0D4;
            border-radius: 18px;
            padding: 12px 18px;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--dark);
            text-align: center;
            letter-spacing: 0.5px;
            word-spacing: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #EDE0D4;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .story-line:active, .story-line.reading-now {
            background: #FFEAA7;
            border-color: #FFA502;
            box-shadow: 0 4px 0 #FFA502;
            transform: scale(1.02);
            color: #D35400;
        }

        /* Matching Mode */
        .match-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            animation: fadeIn 0.25s;
        }

        .match-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            max-width: 680px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .match-card {
            width: 100%;
            min-height: 82px;
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 20px;
            box-shadow: 0 5px 0 #70A1FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            padding: 8px;
            text-align: center;
        }

        .match-card.selected {
            background: #FFEAA7;
            border-color: #FFA502;
            box-shadow: 0 5px 0 #FFA502;
            transform: scale(1.03);
        }

        .match-card.matched {
            background: #7BED9F;
            border-color: #2ED573;
            box-shadow: 0 3px 0 #2ED573;
            opacity: 0.4;
            pointer-events: none;
            transform: scale(0.96);
        }

        .match-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            animation: shake 0.4s;
        }

        /* Quiz Mode */
        .quiz-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
            margin: 4px 0;
            animation: fadeIn 0.25s ease-out;
        }

        .quiz-counter {
            background: #ECCC68;
            color: var(--dark);
            padding: 4px 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
        }

        .sound-prompt-btn {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: #FF6B6B;
            border: 5px solid var(--white);
            box-shadow: 0 6px 0 #EE5253, 0 10px 18px rgba(0,0,0,0.15);
            font-size: 2.8rem;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        .quiz-choices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .choice-card {
            width: 145px;
            min-height: 155px;
            background: var(--white);
            border: 5px solid #70A1FF;
            border-radius: 24px;
            box-shadow: 0 6px 0 #70A1FF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            padding: 10px;
            text-align: center;
        }

        .choice-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            box-shadow: 0 6px 0 #FF4757;
            animation: shake 0.4s;
        }

        .transition-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            gap: 12px;
            animation: fadeIn 0.2s;
        }

        .transition-emoji {
            font-size: 4.5rem;
            animation: bounce 0.6s infinite;
        }

        .transition-text {
            font-size: 1.65rem;
            font-weight: 700;
            color: #2ED573;
            text-align: center;
        }

        /* Voice Studio Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--white);
            width: 100%;
            max-width: 740px;
            max-height: 85vh;
            border-radius: 26px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #F1F2F6;
            padding-bottom: 10px;
        }

        .modal-body {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .voice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: #F8F9FA;
            border-radius: 14px;
            border: 2px solid #DFE4EA;
            flex-wrap: wrap;
            gap: 8px;
        }

        .voice-item-title { font-size: 0.95rem; font-weight: 700; }
        .voice-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

        .rec-btn {
            padding: 6px 11px;
            border: none;
            border-radius: 12px;
            font-family: 'Mali', sans-serif;
            font-weight: 700;
            cursor: pointer;
            color: var(--white);
            font-size: 0.82rem;
        }

        .rec-btn.record { background: #FF4757; }
        .rec-btn.recording { background: #2ED573; animation: pulse 1s infinite; }
        .rec-btn.play { background: #1E90FF; }
        .rec-btn.download { background: #9B5DE5; }
        .rec-btn.delete { background: #747D8C; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        @media (max-width: 550px) {
            .tone-word-big { font-size: 1.55rem; }
            .story-line { font-size: 1.4rem; padding: 10px 12px; word-spacing: 6px; }
        }
    </style>

            currentToneSetIndex = 0;
            playPopSound();
            stopAllSpeech();
            renderStage();
        }

        let blendPoolMode = 'easy';
        let blendHistory = [];
        let blendHistoryIndex = -1;
        let easyWordsGeneratedCount = 0;

        let quizQuestionNumber = 1;
        let currentInstructionTts = 'แตะที่กล่องบัตรคำ เพื่อฟังเสียงอ่านนะจ๊ะ';
        let activeTimers = [];

        function clearAllTimers() {
            activeTimers.forEach(t => clearTimeout(t));
            activeTimers = [];
        }

        function generateRandomBlendWord() {
            const lastWord = blendHistoryIndex >= 0 ? blendHistory[blendHistoryIndex].word : '';

            if (blendPoolMode === 'easy') {
                let maxTier = 1;
                if (easyWordsGeneratedCount >= 5) maxTier = 2;
                if (easyWordsGeneratedCount >= 12) maxTier = 3;
                let candidates = curatedBlendWords.filter(w => w.tier <= maxTier && w.word !== lastWord);
                if (candidates.length === 0) candidates = curatedBlendWords.filter(w => w.tier <= maxTier);
                if (candidates.length === 0) candidates = curatedBlendWords;
                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                easyWordsGeneratedCount++;
                return buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
            } else {
                const activeConsonants = consonants.filter(c => c.char !== 'ฃ' && c.char !== 'ฅ');

                let cObj, vObj, generatedWord;
                do {
                    cObj = activeConsonants[Math.floor(Math.random() * activeConsonants.length)];
                    vObj = vowels[Math.floor(Math.random() * vowels.length)];
                    generatedWord = vObj.template.replace('{c}', cObj.char);
                } while (generatedWord === lastWord);

                return buildBlendObject(cObj, vObj, 'ฝึกอ่านออกเสียง', '❓');
            }
        }

        function ensureInitialBlendWord() {
            if (blendHistory.length === 0) {
                blendHistory.push(generateRandomBlendWord());
                blendHistoryIndex = 0;
            }
        }

        /* ==================== 6. ระบบฐานข้อมูลเสียงผู้ปกครอง (IndexedDB) ==================== */
        let db;
        const recordedKeys = new Set();
        let activeRecordedAudioUrl = null;
        let customStories = []; // Cache for Level 7 stories

        let __speechUnlocked = false;
        function unlockAudioForKidsApp() {
            if (__speechUnlocked) return;
            __speechUnlocked = true;
            try {
                if ('speechSynthesis' in window) {
                    const warmup = new SpeechSynthesisUtterance(' ');
                    warmup.volume = 0;
                    window.speechSynthesis.speak(warmup);
                }
            } catch (e) {}
            try {
                const player = document.getElementById('tts-audio-player');
                if (player) {
                    const p = player.play();
                    if (p && p.catch) p.catch(() => {});
                    player.pause();
                }
            } catch (e) {}
        }
        document.addEventListener('pointerdown', unlockAudioForKidsApp, { once: true, capture: true });
        document.addEventListener('click', unlockAudioForKidsApp, { once: true, capture: true });
        document.addEventListener('touchstart', unlockAudioForKidsApp, { once: true, capture: true });

        function revokeActiveRecordedAudioUrl() {
            if (!activeRecordedAudioUrl) return;
            URL.revokeObjectURL(activeRecordedAudioUrl);
            activeRecordedAudioUrl = null;
        }

        function initDB() {
            return new Promise((resolve) => {
                if (!('indexedDB' in window)) {
                    db = null;
                    recordedKeys.clear();
                    return resolve();
                }

                // Upgrade DB Version to 2 for Custom Stories
                const request = indexedDB.open('ThaiKidsVoiceDB', 2);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('voices')) {
                        database.createObjectStore('voices');
                    }
                    if (!database.objectStoreNames.contains('stories')) {
                        database.createObjectStore('stories', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    Promise.all([loadRecordedKeys(), loadCustomStories()]).then(resolve);
                };
                request.onerror = () => resolve();
            });
        }

        function loadCustomStories() {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction('stories', 'readonly');
                const req = tx.objectStore('stories').getAll();
                req.onsuccess = () => {
                    customStories = req.result || [];
                    resolve();
                };
                req.onerror = () => resolve();
            });
        }

        function saveCustomStoryDB(storyObj) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('IndexedDB is unavailable'));
                    return;
                }
                const tx = db.transaction('stories', 'readwrite');
                tx.objectStore('stories').put(storyObj);
                tx.oncomplete = () => {
                    const idx = customStories.findIndex(s => s.id === storyObj.id);
                    if (idx > -1) customStories[idx] = storyObj;
                    else customStories.push(storyObj);
                    resolve();
                };
                tx.onerror = () => reject(tx.error || new Error('Unable to save custom story'));
                tx.onabort = () => reject(tx.error || new Error('Custom story save was aborted'));
            });
        }

        function deleteCustomStoryDB(id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('IndexedDB is unavailable'));
                    return;
                }
                const tx = db.transaction('stories', 'readwrite');
                tx.objectStore('stories').delete(id);
                tx.oncomplete = () => {
                    customStories = customStories.filter(s => s.id !== id);
                    resolve();
                };
                tx.onerror = () => reject(tx.error || new Error('Unable to delete custom story'));
                tx.onabort = () => reject(tx.error || new Error('Custom story deletion was aborted'));
            });
        }

        function loadRecordedKeys() {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction('voices', 'readonly');
                const req = tx.objectStore('voices').getAllKeys();
                req.onsuccess = () => {
                    recordedKeys.clear();
                    req.result.forEach(k => recordedKeys.add(k));
                    resolve();
                };
                req.onerror = () => resolve();
            });
        }

        function saveVoiceBlob(key, blob) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('IndexedDB is unavailable'));
                    return;
                }
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').put(blob, key);
                tx.oncomplete = () => { recordedKeys.add(key); resolve(); };
                tx.onerror = () => reject(tx.error || new Error('Unable to save voice recording'));
                tx.onabort = () => reject(tx.error || new Error('Voice recording save was aborted'));
            });
        }

        function getVoiceBlob(key) {
            return new Promise((resolve) => {
                if (!db || !recordedKeys.has(key)) return resolve(null);
                const tx = db.transaction('voices', 'readonly');
                const req = tx.objectStore('voices').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        function deleteVoiceBlob(key) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('IndexedDB is unavailable'));
                    return;
                }
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').delete(key);
                tx.oncomplete = () => { recordedKeys.delete(key); resolve(); };
                tx.onerror = () => reject(tx.error || new Error('Unable to delete voice recording'));
                tx.onabort = () => reject(tx.error || new Error('Voice recording deletion was aborted'));
            });
        }

        /* ==================== 7. ระบบเสียง 3 ชั้น: อัดเสียง -> โฟลเดอร์ audio/*.mp3 บน GitHub -> เสียงอัตโนมัติในเครื่อง ==================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let speechSessionId = 0;

        function initAudio() {
            if (!AudioContext) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type = 'sine', duration = 0.14, delay = 0) {
            initAudio();
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay * 1000);
        }

        function playPopSound() { playTone(520, 'sine', 0.07); }
        function playSuccessSound() {
            playTone(523.25, 'triangle', 0.12, 0);
            playTone(659.25, 'triangle', 0.12, 0.1);
            playTone(783.99, 'triangle', 0.12, 0.2);
            playTone(1046.50, 'triangle', 0.25, 0.3);
        }
        function playWrongSound() {
            playTone(280, 'sawtooth', 0.15, 0);
            playTone(210, 'sawtooth', 0.2, 0.14);
        }

        function stopAllSpeech() {
            speechSessionId++;
            clearAllTimers();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            const player = document.getElementById('tts-audio-player');
            if (player) player.pause();
            revokeActiveRecordedAudioUrl();
        }

        function getBestThaiVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices();
            const thVoices = voices.filter(v => v.lang && v.lang.toLowerCase().includes('th'));
            if (thVoices.length === 0) return null;

            return thVoices.find(v => v.name.includes('Premwadee') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Niwat') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Premwadee')) ||
                   thVoices.find(v => v.name.includes('Google')) ||
                   thVoices.find(v => v.name.includes('Kanya')) ||
                   thVoices[0];
        }

        // โหมดเสียงอัตโนมัติในเครื่อง (ที่ได้ยินชัดเจนบน Huawei P30 Pro)
        function playNativeSpeechDirect(ttsText, mySession, safeCallback) {
            if (mySession !== speechSessionId) return;
            if (!('speechSynthesis' in window)) {
                setTimeout(safeCallback, 500);
                return;
            }

            try {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(ttsText);
                utter.lang = 'th-TH';
                utter.rate = 0.92;
                utter.pitch = 1.0;

                const bestVoice = getBestThaiVoice();
                if (bestVoice) utter.voice = bestVoice;

                utter.onend = () => safeCallback();
                utter.onerror = () => safeCallback();

                window.speechSynthesis.speak(utter);
            } catch (e) {
                safeCallback();
            }
        }

        // ลองเล่นไฟล์เสียงจากโฟลเดอร์ audio/<voiceKey>.mp3 บน GitHub ของคุณพ่อก่อน หากยังไม่มีไฟล์ค่อยใช้เสียงอัตโนมัติในเครื่อง
        function playGitHubMp3OrFallback(voiceKey, ttsText, mySession, safeCallback) {
            if (mySession !== speechSessionId) return;
            if (!voiceKey) {
                playNativeSpeechDirect(ttsText, mySession, safeCallback);
                return;
            }

            let playbackSettled = false;
            const triggerFallback = () => {
                if (playbackSettled || mySession !== speechSessionId) return;
                playbackSettled = true;
                playNativeSpeechDirect(ttsText, mySession, safeCallback);
            };

            const player = document.getElementById('tts-audio-player');
            const normalizedKey = voiceKey.normalize('NFC');
            // Keep the URL query-free so the Service Worker can match cached audio.
            player.src = `audio/${encodeURIComponent(normalizedKey)}.mp3`;
            player.onended = () => {
                playbackSettled = true;
                safeCallback();
            };
            player.onerror = () => {
                // หากยังไม่ได้อัปโหลดไฟล์ .mp3 ของคำนี้ขึ้นโฟลเดอร์ audio/ ให้สลับไปใช้เสียงอัตโนมัติในเครื่องทันที
                triggerFallback();
            };

            try {
                const playPromise = player.play();
                if (playPromise !== undefined) {
                    playPromise.catch(triggerFallback);
                }
            } catch {
                triggerFallback();
            }
        }

        function speakSmart(voiceKey, ttsText, callback) {
            stopAllSpeech();
            const mySession = speechSessionId;
            let callbackCalled = false;

            const safeCallback = () => {
                if (!callbackCalled && mySession === speechSessionId) {
                    callbackCalled = true;
                    if (callback) callback();
                }
            };

            // 1. เช็คเสียงที่ผู้ปกครองอัดไว้ในเครื่องก่อน
            if (voiceKey && recordedKeys.has(voiceKey)) {
                getVoiceBlob(voiceKey).then(blob => {
                    if (mySession !== speechSessionId) return;
                    if (blob) {
                        const player = document.getElementById('tts-audio-player');
                        const url = URL.createObjectURL(blob);
                        activeRecordedAudioUrl = url;
                        let playbackSettled = false;
                        const releaseUrl = () => {
                            if (activeRecordedAudioUrl === url) {
                                URL.revokeObjectURL(url);
                                activeRecordedAudioUrl = null;
                            }
                        };
                        const triggerFallback = () => {
                            if (playbackSettled || mySession !== speechSessionId) return;
                            playbackSettled = true;
                            releaseUrl();
                            playGitHubMp3OrFallback(voiceKey, ttsText, mySession, safeCallback);
                        };

                        player.src = url;
                        player.onended = () => {
                            playbackSettled = true;
                            releaseUrl();
                            safeCallback();
                        };
                        player.onerror = triggerFallback;
                        try {
                            const playPromise = player.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(triggerFallback);
                            }
                        } catch {
                            triggerFallback();
                        }
                    } else {
                        playGitHubMp3OrFallback(voiceKey, ttsText, mySession, safeCallback);
                    }
                }, () => {
                    if (mySession === speechSessionId) {
                        playGitHubMp3OrFallback(voiceKey, ttsText, mySession, safeCallback);
                    }
                });
                return;
            }

            // 2. เล่นจากโฟลเดอร์ audio/*.mp3 บน GitHub (หากไม่มีจะใช้เสียงอัตโนมัติในเครื่องทันที)
            playGitHubMp3OrFallback(voiceKey, ttsText, mySession, safeCallback);
        }

        function speakCurrentFlashcard(lv) {

        /* ==================== 10. โหมดเรียนรู้ ด่าน 3 & 4 ==================== */
        function renderLevel3And4Learn(container, lv) {

            } else {
                setInstruction('แตะที่กล่องเพื่อฝึกสะกดคำ (เช่น ตอ อา ตา)', 'แตะที่กล่องเพื่อฝึกสะกดคำ เช่น ตอ อา ตา');

                        <div class="slot-sub-text">${subC}</div>
                    </div>
                    <div class="eq-symbol">+</div>
                    <div class="eq-slot vowel-slot" id="slot-v" onclick="speakSinglePart('v')">

                <div class="phonetic-banner" onclick="playBlendEquation()">

                <div class="word-nav">
                    <button class="action-btn btn-prev" onclick="stepBlendWord(-1)">⬅️ คำก่อนหน้า</button>
                    <button class="action-btn btn-speak-all" onclick="playBlendEquation()">🔊 ฟังเสียงอ่าน</button>
                    <button class="action-btn btn-random" onclick="stepBlendWord(1)">🎲 สุ่มคำถัดไป ➡️</button>
                </div>
            `;

        function setBlendPoolMode(mode) {
            playPopSound();
            stopAllSpeech();
            blendPoolMode = mode;
            blendHistory.push(generateRandomBlendWord());
            blendHistoryIndex = blendHistory.length - 1;
            renderStage();
        }

        function speakSinglePart(part) {
            unlockAudioForKidsApp();
            playPopSound();
            const item = blendHistory[blendHistoryIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            if (!slotC || !slotV) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');

            if (part === 'c') {
                slotC.classList.add('highlight');
                const key = currentLevel === 3 ? `c_${item.c}` : null;
                speakSmart(key, currentLevel === 3 ? item.cTts : item.cSound, () => slotC.classList.remove('highlight'));
            } else {
                slotV.classList.add('highlight');
                const vObj = vowels.find(v => v.display === item.v);
                const key = (currentLevel === 3 && vObj) ? vObj.id : null;
                speakSmart(key, currentLevel === 3 ? item.vTts : item.vSound, () => slotV.classList.remove('highlight'));
            }
        }

        function playBlendEquation() {
            unlockAudioForKidsApp();
            playPopSound();
            const item = blendHistory[blendHistoryIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            const slotW = document.getElementById('slot-w');
            if (!slotC || !slotV || !slotW) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');
            slotW.classList.remove('highlight');

            const voiceKey = currentLevel === 3 ? `${item.id}_lv3` : `${item.id}_lv4`;
            const fullTts = currentLevel === 3
                ? `${item.cTts} ${item.vTts} อ่านว่า ${item.cSound} ${item.vSound} ${item.word}`
                : `${item.cSound} ${item.vSound} ${item.word}`;

            const t1 = currentLevel === 3 ? 950 : 600;
            const t2 = currentLevel === 3 ? 1950 : 1200;

            slotC.classList.add('highlight');
            speakSmart(voiceKey, fullTts, () => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.remove('highlight');
            });

            activeTimers.push(setTimeout(() => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.add('highlight');
            }, t1));

            activeTimers.push(setTimeout(() => {
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.add('highlight');
            }, t2));
        }

        function stepBlendWord(dir) {
            playPopSound();
            stopAllSpeech();
            if (dir < 0) {
                if (blendHistoryIndex > 0) blendHistoryIndex--;
                else {
                    blendHistory.unshift(generateRandomBlendWord());
                    blendHistoryIndex = 0;
                }
            } else {
                if (blendHistoryIndex < blendHistory.length - 1) blendHistoryIndex++;
                else {
                    blendHistory.push(generateRandomBlendWord());
                    blendHistoryIndex = blendHistory.length - 1;
                }
            }
            renderStage();
        }

        /* ==================== 11. ด่านที่ 5: วรรณยุกต์หรรษา & การผัน 5 เสียง ==================== */
        function renderLevel5Learn(container) {
            setInstruction('🎵 แตะที่รูปวรรณยุกต์ด้านบน หรือแตะกล่องทั้ง 5 ช่องเพื่อฝึกผันวรรณยุกต์จ้า', 'แตะที่รูปวรรณยุกต์ หรือแตะกล่องเพื่อฝึกผันเสียงวรรณยุกต์จ้า');
            const pool = getActiveToneSets();
            if (currentToneSetIndex >= pool.length) currentToneSetIndex = 0;
            const set = pool[currentToneSetIndex];
            const toneLabels = ['สามัญ', 'ไม้เอก (◌่)', 'ไม้โท (◌้)', 'ไม้ตรี (◌๊)', 'ไม้จัตวา (◌๋)'];

            const wrapper = document.createElement('div');
            wrapper.className = 'blend-stage';

            let marksHtml = '';
            toneMarks.forEach((m, i) => {
                const applicable = set.words[i + 1] !== null && set.words[i + 1] !== undefined;
                marksHtml += `
                    <div class="tone-mark-pill ${applicable ? '' : 'disabled'}" ${applicable ? `onclick="speakSmart('${m.id}', '${m.tts}')"` : ''}>
                        <div style="font-size:2rem; font-weight:700; color:${applicable ? '#F15BB5' : '#ccc'};">${m.mark}</div>
                        <div style="font-size:0.9rem; font-weight:700;">${m.name}</div>
                    </div>
                `;
            });

            let stepsHtml = '';
            set.words.forEach((w, idx) => {
                if (w === null || w === undefined) {
                    stepsHtml += `
                        <div class="tone-step-card disabled" id="tone-step-${idx}">
                            <div class="tone-word-big">–</div>
                            <div class="tone-label-small">${toneLabels[idx]} (ผันไม่ได้)</div>
                        </div>
                    `;
                } else {
                    stepsHtml += `
                        <div class="tone-step-card" id="tone-step-${idx}" onclick="speakSingleToneStep(${idx})">
                            <div class="tone-word-big">${w}</div>
                            <div class="tone-label-small">${toneLabels[idx]}</div>

                }
            });

            wrapper.innerHTML = `
                <div class="tone-marks-bar">${marksHtml}</div>

                <div class="tone-steps-row">${stepsHtml}</div>
                <div class="phonetic-banner" onclick="playAllToneSteps()">
                    📢 แตะเพื่อผันเสียง: "${set.words.filter(Boolean).join(' - ')}" ${recordedKeys.has(set.id) ? '🎙️' : ''}
                </div>
                <div class="word-nav">
                    <button class="action-btn btn-prev" onclick="stepToneSet(-1)">⬅️ คำก่อนหน้า</button>
                    <button class="action-btn btn-speak-all" onclick="playAllToneSteps()">🔊 ผันครบทุกเสียง</button>
                    <button class="action-btn btn-next" onclick="stepToneSet(1)">คำถัดไป ➡️</button>
                </div>
                <div class="word-nav" style="margin-top:8px;">
                    <button class="filter-chip ${toneHardMode ? 'active' : ''}" onclick="setToneHardMode(${!toneHardMode})">
                        🔥 โหมดยาก (เสียงสูง-ต่ำ)
                    </button>
                </div>
            `;
            container.appendChild(wrapper);
        }

        function speakSingleToneStep(idx) {
            playPopSound();
            const set = getActiveToneSets()[currentToneSetIndex];
            if (set.words[idx] === null || set.words[idx] === undefined) return;
            document.querySelectorAll('.tone-step-card').forEach(el => el.classList.remove('highlight'));
            const card = document.getElementById(`tone-step-${idx}`);
            if (card) card.classList.add('highlight');
            speakSmart(`${set.id}_${idx}`, set.words[idx], () => {
                if (card) card.classList.remove('highlight');
            });
        }

        function playAllToneSteps() {
            playPopSound();
            const set = getActiveToneSets()[currentToneSetIndex];
            document.querySelectorAll('.tone-step-card').forEach(el => el.classList.remove('highlight'));

            const validIndexes = [];
            set.words.forEach((w, i) => { if (w !== null && w !== undefined) validIndexes.push(i); });

            const expectedLevel = currentLevel;
            const expectedSetId = set.id;
            function playStep(pos) {
                if (currentLevel !== expectedLevel || getActiveToneSets()[currentToneSetIndex]?.id !== expectedSetId) return;
                document.querySelectorAll('.tone-step-card').forEach(el => el.classList.remove('highlight'));
                if (pos >= validIndexes.length) return;
                const idx = validIndexes[pos];
                const el = document.getElementById(`tone-step-${idx}`);
                if (el) el.classList.add('highlight');
                speakSmart(`${set.id}_${idx}`, set.words[idx], () => {
                    activeTimers.push(setTimeout(() => playStep(pos + 1), 300));
                });
            }

            playStep(0);
        }

        function stepToneSet(dir) {
            playPopSound();
            stopAllSpeech();
            const pool = getActiveToneSets();
            currentToneSetIndex = (currentToneSetIndex + dir + pool.length) % pool.length;
            renderStage();
        }

        /* ==================== 12. ด่านที่ 6: หัดอ่านประโยค สไตล์ มานะ-มานี ==================== */
        function getFilteredStories() {
            return stories.filter(s => s.diff === currentStoryDiff);
        }

        function renderLevel6Learn(container) {
            setInstruction('📖 แตะที่บรรทัดเพื่อฟังเสียงอ่านทีละบรรทัด หรือกดปุ่มสีเขียวเพื่ออ่านทั้งหน้าจ้า', 'แตะที่บรรทัดเพื่อฟังเสียงอ่านทีละบรรทัดนะจ๊ะ');

            story.lines.forEach((line, idx) => {
                const lineKey = `${story.id}_line_${idx}`;
                linesHtml += `
                    <div class="story-line" id="story-line-${idx}" onclick="readStoryLine(${idx})">

                    <button class="filter-chip ${currentStoryDiff === 3 ? 'active' : ''}" onclick="setStoryDifficulty(3)">⭐⭐⭐ ระดับ 3 (ผสมวรรณยุกต์)</button>

                <div class="story-book">
                    <div class="story-header">
                        <span class="story-title">📕 ${story.title}</span>

                    <button class="action-btn btn-speak-all" onclick="readFullStoryPage()">🔊 อ่านให้ฟังทั้งหน้า</button>

                </div>

        function setStoryDifficulty(diff) {
            playPopSound();
            stopAllSpeech();
            currentStoryDiff = diff;
            currentStoryIndex = 0;
            renderStage();
        }

        function stepStoryPage(dir) {
            playPopSound();
            stopAllSpeech();
            const list = getFilteredStories();
            currentStoryIndex = (currentStoryIndex + dir + list.length) % list.length;
            renderStage();
        }

        function readStoryLine(idx) {
            playPopSound();
            const story = getFilteredStories()[currentStoryIndex];
            if (!story) return;

            document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
            const lineEl = document.getElementById(`story-line-${idx}`);
            if (lineEl) lineEl.classList.add('reading-now');

            const lineKey = `${story.id}_line_${idx}`;
            const ttsText = story.lines[idx].replace(/ /g, '');
            speakSmart(lineKey, ttsText, () => {
                if (lineEl) lineEl.classList.remove('reading-now');
            });
        }

        function readFullStoryPage() {
            stopAllSpeech();
            playPopSound();
            const story = getFilteredStories()[currentStoryIndex];
            if (!story) return;

            const expectedLevel = currentLevel;
            const expectedStoryId = story.id;
            let idx = 0;
            const readNext = () => {
                if (currentLevel !== expectedLevel || getFilteredStories()[currentStoryIndex]?.id !== expectedStoryId) return;
                if (idx >= story.lines.length) {
                    document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
                    return;
                }
                document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
                const lineEl = document.getElementById(`story-line-${idx}`);
                if (lineEl) lineEl.classList.add('reading-now');

                const lineKey = `${story.id}_line_${idx}`;
                const lineText = story.lines[idx].replace(/ /g, '');
                idx++;
                speakSmart(lineKey, lineText, () => {
                    activeTimers.push(setTimeout(readNext, 300));
                });
            };
            readNext();
        }

        /* ==================== 12.5 ด่านที่ 7: นิทานของฉัน (Custom Stories) ==================== */

                            card.appendChild(cover);

                            const cover = document.createElement('div');
                            cover.className = 'custom-book-cover';

                            cover.style.alignItems = 'center';

                            cover.style.fontSize = '3rem';

            stage.className = 'story-stage';
            stage.innerHTML = `
                <div class="story-book">
                    <div class="story-header">
                        <button class="util-btn" id="custom-book-back">⬅️ กลับชั้นหนังสือ</button>
                        <span class="card-progress" id="custom-book-progress"></span>
                    </div>
                    <div class="story-lines-box" id="custom-story-lines"></div>
                </div>
                <div class="word-nav">
                    <button class="action-btn btn-prev" id="custom-book-prev">⬅️ หน้าก่อนหน้า</button>
                    <button class="action-btn btn-speak-all" id="custom-book-read">🔊 อ่านให้ฟังทั้งหน้า</button>

            stage.querySelector('#custom-book-progress').textContent = `หน้าที่ ${currentCustomStoryPage + 1} / ${story.pages.length}`;

                image.className = 'story-img-preview';
                image.alt = '';
                stage.querySelector('.story-book').insertBefore(image, stage.querySelector('#custom-story-lines'));

            const lines = page.lines || [page.text || ''];
            lines.forEach((lineText, lIdx) => {

                line.className = 'story-line';
                line.id = `cs-line-${lIdx}`;
                line.onclick = () => readCustomStoryLine(lIdx);
                const soundIcon = document.createElement('span');
                soundIcon.textContent = '🔊';
                const text = document.createElement('span');
                text.textContent = lineText;
                line.append(soundIcon, text);

                const lineVoiceKey = `cs_${story.id}_p_${currentCustomStoryPage}_l_${lIdx}`;
                if (recordedKeys.has(lineVoiceKey)) {
                    const recordedIcon = document.createElement('span');
                    recordedIcon.style.fontSize = '1rem';
                    recordedIcon.textContent = '🎙️';
                    line.appendChild(recordedIcon);
                }
                stage.querySelector('#custom-story-lines').appendChild(line);
            });
            container.appendChild(stage);
        }

        function openCustomBook(id) {

            currentCustomStoryPage = 0;

            jigsawPool = [];
            jigsawSelected = [];
            detectiveTarget = null;
            detectiveAnswered = false;

        function stepCustomBookPage(dir) {

            stopAllSpeech();

            currentCustomStoryPage = (currentCustomStoryPage + dir + story.pages.length) % story.pages.length;

            jigsawPool = [];

            renderStage();

        function selectJigsaw(pIdx) {

            const word = jigsawPool.splice(pIdx, 1)[0];

            jigsawSelected.push(word);

            if (jigsawPool.length === 0) {

                    jigsawSelected.every((selectedWord, index) => selectedWord === jigsawTarget[index]);
                if (isCorrect) {
                    playSuccessSound();

                        jigsawPool = [];
                        jigsawSelected = [];

                    playWrongSound();
                    speakSmart('sys_wrong', 'เรียงผิดจ้า ลองใหม่นะ', () => {
                        jigsawPool = [...jigsawTarget].sort(() => Math.random() - 0.5);

                setInstruction('🔍 หน้านี้คำศัพท์น้อยไปจ้า ลองหาหน้าที่ยาวกว่านี้นะ', 'หน้านี้คำศัพท์น้อยไปจ้า');

                detectiveTarget = uniqueWords[Math.floor(Math.random() * uniqueWords.length)];

        function handleDetectiveChoice(cardEl, word) {
            if (detectiveAnswered) return;
            if (word === detectiveTarget) {
                detectiveAnswered = true;
                playSuccessSound();
                addStar();
                showTransitionScreen('หาเจอแล้ว เก่งมากเลย!', () => {
                    detectiveTarget = null;
                    detectiveAnswered = false;
                    renderStage();
                });
            } else {
                if (cardEl.classList.contains('wrong')) return;
                cardEl.classList.add('wrong');
                playWrongSound();
                speakSmart('sys_wrong', 'ลองดูใหม่อีกทีนะจ๊ะ', () => {
                    setTimeout(() => cardEl.classList.remove('wrong'), 400);
                });
            }
        }

        function readCustomStoryLine(lIdx) {
            playPopSound();
            const story = customStories.find(s => s.id === currentCustomStoryId);
            if (!story) return;
            const page = story.pages[currentCustomStoryPage];
            const lineText = (page.lines || [])[lIdx] || '';
            const lineVoiceKey = `cs_${story.id}_p_${currentCustomStoryPage}_l_${lIdx}`;

            document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
            const lineEl = document.getElementById(`cs-line-${lIdx}`);
            if (lineEl) lineEl.classList.add('reading-now');

            const ttsText = lineText.replace(/ /g, '');
            speakSmart(lineVoiceKey, ttsText, () => {
                if (lineEl) lineEl.classList.remove('reading-now');
            });
        }

        function readCustomStoryPageFull() {
            stopAllSpeech();
            playPopSound();
            const story = customStories.find(s => s.id === currentCustomStoryId);
            if (!story) return;

            const page = story.pages[currentCustomStoryPage];
            const lines = page.lines || [];
            let lIdx = 0;
            const expectedStoryId = story.id;
            const expectedPage = currentCustomStoryPage;

            const readNext = () => {
                if (currentCustomStoryId !== expectedStoryId || currentCustomStoryPage !== expectedPage) return;
                if (lIdx >= lines.length) {
                    document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
                    return;
                }

                document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
                const lineEl = document.getElementById(`cs-line-${lIdx}`);
                if (lineEl) lineEl.classList.add('reading-now');

                const lineVoiceKey = `cs_${story.id}_p_${currentCustomStoryPage}_l_${lIdx}`;
                const ttsText = lines[lIdx].replace(/ /g, '');
                lIdx++;

                speakSmart(lineVoiceKey, ttsText, () => {
                    activeTimers.push(setTimeout(readNext, 300));
                });
            };
            readNext();
        }

        /* ==================== 13. โหมดจับคู่ ==================== */
        let selectedLeft = null;
        let selectedRight = null;
        let matchedPairsCount = 0;

        function renderMatchGame(container) {
            container.innerHTML = '';
            selectedLeft = null;
            selectedRight = null;
            matchedPairsCount = 0;

            let pool = [];
            if (currentLevel === 1) {
                setInstruction('🧩 แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ', 'แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ');
                pool = [...consonants].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.char, rightText: `${x.emoji} ${x.name}`, ttsLeft: x.sound, ttsRight: x.tts, keyRight: x.id
                }));
            } else if (currentLevel === 2) {
                setInstruction('🧩 จับคู่รูปสระ กับชื่อสระให้ถูกต้องนะจ๊ะ', 'จับคู่รูปสะ ระ กับชื่อสะ ระให้ถูกต้องนะจ๊ะ');
                pool = [...vowels].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.display, rightText: x.name, ttsLeft: x.sound, ttsRight: x.tts, keyRight: x.id
                }));
            } else if (currentLevel === 5) {
                setInstruction('🧩 จับคู่คำที่มีวรรณยุกต์ กับภาพความหมายให้ตรงกันจ้า', 'จับคู่คำวรรณยุกต์ กับภาพความหมายให้ตรงกันจ้า');
                pool = [...toneSets].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.targetWord, rightText: `${x.emoji} ${x.sampleWord}`, ttsLeft: x.targetWord, ttsRight: x.sampleWord
                }));
            } else if (currentLevel === 6) {
                setInstruction('🧩 จับคู่ประโยคสั้นๆ กับภาพเหตุการณ์ให้ตรงกันจ้า', 'จับคู่ประโยค กับภาพให้ตรงกันจ้า');
                pool = [...stories].sort(() => 0.5 - Math.random()).slice(0, 4).map(s => ({
                    id: s.id,
                    leftText: s.lines[0],
                    rightText: `${s.emoji} ${s.title.replace(/บทที่ \S+ /, '')}`,
                    ttsLeft: s.lines[0].replace(/ /g, ''),
                    ttsRight: s.title.replace(/บทที่ \S+ /, '').replace(/ /g, ''),
                    keyLeft: `${s.id}_line_0`
                }));
            } else {
                setInstruction('🧩 จับคู่คำอ่านฝั่งซ้าย กับความหมายฝั่งขวาให้ตรงกันจ้า', 'จับคู่คำอ่าน กับความหมายให้ตรงกันจ้า');
                const randomCurated = [...curatedBlendWords].sort(() => 0.5 - Math.random()).slice(0, 4);
                pool = randomCurated.map(pick => {
                    const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                    const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                    const b = buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                    const isLv3 = currentLevel === 3;
                    const matchTtsLeft = isLv3
                        ? `${b.cTts} ${b.vTts} อ่านว่า ${b.cSound} ${b.vSound} ${b.word}`
                        : `${b.cSound} ${b.vSound} ${b.word}`;
                    const matchKeyLeft = isLv3 ? `${b.id}_lv3` : `${b.id}_lv4`;
                    return {
                        id: b.id,
                        leftText: b.word,
                        rightText: `${b.emoji} ${b.meaning}`,
                        ttsLeft: matchTtsLeft,
                        ttsRight: b.meaning,
                        keyLeft: matchKeyLeft
                    };
                });
            }

            const leftItems = [...pool].sort(() => 0.5 - Math.random());
            const rightItems = [...pool].sort(() => 0.5 - Math.random());

            const board = document.createElement('div');

                colL.appendChild(card);
            });

            rightItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.setAttribute('tabindex', '0');
                card.onkeydown = (e) => { if(e.key === 'Enter') card.click(); };
                card.style.fontSize = '1.2rem';
                card.innerText = item.rightText;
                card.onclick = () => selectMatchCard('right', card, item);
                colR.appendChild(card);
            });

            cols.appendChild(colL);
            cols.appendChild(colR);
            board.appendChild(cols);
            container.appendChild(board);
        }

        function selectMatchCard(side, cardEl, item) {
            playPopSound();
            const clickedTts = side === 'left' ? item.ttsLeft : item.ttsRight;
            const clickedKey = side === 'left' ? (item.keyLeft || null) : (item.keyRight || null);

            if (side === 'left') {
                if (selectedLeft) selectedLeft.el.classList.remove('selected');
                selectedLeft = { el: cardEl, item };
                cardEl.classList.add('selected');
            } else {
                if (selectedRight) selectedRight.el.classList.remove('selected');
                selectedRight = { el: cardEl, item };
                cardEl.classList.add('selected');
            }

            if (!selectedLeft || !selectedRight) {
                speakSmart(clickedKey, clickedTts);
                return;
            }

            const left = selectedLeft;
            const right = selectedRight;
            selectedLeft = null;
            selectedRight = null;

            if (left.item.id === right.item.id) {
                left.el.classList.remove('selected');
                right.el.classList.remove('selected');
                left.el.classList.add('matched');
                right.el.classList.add('matched');
                playSuccessSound();
                matchedPairsCount++;

                speakSmart(clickedKey, clickedTts, () => {
                    if (matchedPairsCount === 4) {
                        addStar();
