        function speakCurrentFlashcard(lv) {
            playPopSound();
            const box = document.getElementById('main-flashcard');
            if (!box) return;
            box.classList.add('speaking');
            const item = lv === 1 ? consonants[currentConsonantIndex] : vowels[currentVowelIndex];
            speakSmart(item.id, item.tts, () => box.classList.remove('speaking'));
        }

        function stepFlashcard(lv, dir) {
            playPopSound();
            stopAllSpeech();
            if (lv === 1) currentConsonantIndex = (currentConsonantIndex + dir + consonants.length) % consonants.length;
            else currentVowelIndex = (currentVowelIndex + dir + vowels.length) % vowels.length;
            renderStage();
        }

        /* ==================== 10. โหมดเรียนรู้ ด่าน 3 & 4 (สุ่มคำผสม) ==================== */
        function renderLevel3And4Learn(container, lv) {
            ensureInitialBlendWord();
            const item = blendHistory[blendHistoryIndex];
            const voiceKey = lv === 3 ? `${item.id}_lv3` : `${item.id}_lv4`;

            if (lv === 3) {
                setInstruction('แตะที่กล่องเพื่อฟังเสียงผสมคำ (เช่น ตอ เต่า สระ อา อ่านว่า ตอ อา ตา)', 'แตะที่กล่องเพื่อฟังเสียงผสมคำ เช่น ตอ เต่า สะ-ระ อา อ่านว่า ตอ อา ตา');
            } else {
                setInstruction('แตะที่กล่องเพื่อฝึกสะกดคำ (เช่น ตอ อา ตา)', 'แตะที่กล่องเพื่อฝึกสะกดคำ เช่น ตอ อา ตา');
            }

            const subC = lv === 3 ? item.cName : item.cSound;
            const subV = lv === 3 ? item.vName : item.vSound;
            const bannerText = lv === 3
                ? `${item.cName} + ${item.vName} อ่านว่า "${item.cSound} ${item.vSound} ${item.word}"`
                : `สะกดว่า: "${item.cSound} - ${item.vSound} - ${item.word}"`;

            const wrapper = document.createElement('div');
            wrapper.className = 'blend-stage';
            wrapper.innerHTML = `
                <div class="blend-filter-bar">
                    <button class="filter-chip ${blendPoolMode === 'easy' ? 'active' : ''}" onclick="setBlendPoolMode('easy')">
                        ⭐ สุ่มคำง่ายที่มีความหมาย
                    </button>
                    <button class="filter-chip ${blendPoolMode === 'free' ? 'active' : ''}" onclick="setBlendPoolMode('free')">
                        🎲 สุ่มอิสระ (พยัญชนะ+สระ)
                    </button>
                </div>

                <div class="equation-box">
                    <div class="eq-slot consonant-slot" id="slot-c" onclick="speakSinglePart('c')">
                        <div class="slot-main-text" style="color: #FF4757;">${item.c}</div>
                        <div class="slot-sub-text">${subC}</div>
                    </div>
                    <div class="eq-symbol">+</div>
                    <div class="eq-slot vowel-slot" id="slot-v" onclick="speakSinglePart('v')">
                        <div class="slot-main-text" style="color: #00A8FF;">${item.v}</div>
                        <div class="slot-sub-text">${subV}</div>
                    </div>
                    <div class="eq-symbol">=</div>
                    <div class="eq-slot result-slot" id="slot-w" onclick="playBlendEquation()">
                        <div class="slot-main-text" style="color: #2ED573;">${item.word}</div>
                        ${showImages ? `<div class="slot-sub-text">${item.emoji} ${item.meaning}</div>` : `<div class="slot-sub-text">${item.word}</div>`}
                    </div>
                </div>

                <div class="phonetic-banner" onclick="playBlendEquation()">
                    📢 แตะเพื่อฟัง: ${bannerText} ${recordedKeys.has(voiceKey) ? '🎙️' : ''}
                </div>

                <div class="word-nav">
                    <button class="action-btn btn-prev" onclick="stepBlendWord(-1)">⬅️ คำก่อนหน้า</button>
                    <button class="action-btn btn-speak-all" onclick="playBlendEquation()">🔊 ฟังเสียงอ่าน</button>
                    <button class="action-btn btn-random" onclick="stepBlendWord(1)">🎲 สุ่มคำถัดไป ➡️</button>
                </div>
            `;
            container.appendChild(wrapper);
        }

        function setBlendPoolMode(mode) {
            playPopSound();
            stopAllSpeech();
            blendPoolMode = mode;
            blendHistory.push(generateRandomBlendWord());
            blendHistoryIndex = blendHistory.length - 1;
            renderStage();
        }

        function speakSinglePart(part) {
            playPopSound();
            const item = blendHistory[blendHistoryIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            if (!slotC || !slotV) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');

            if (part === 'c') {
                slotC.classList.add('highlight');
                speakSmart(null, currentLevel === 3 ? item.cTts : item.cSound, () => slotC.classList.remove('highlight'));
            } else {
                slotV.classList.add('highlight');
                speakSmart(null, currentLevel === 3 ? item.vTts : item.vSound, () => slotV.classList.remove('highlight'));
            }
        }

        function playBlendEquation() {
            playPopSound();
            const item = blendHistory[blendHistoryIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            const slotW = document.getElementById('slot-w');
            if (!slotC || !slotV || !slotW) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');
            slotW.classList.remove('highlight');

            const voiceKey = currentLevel === 3 ? `${item.id}_lv3` : `${item.id}_lv4`;
            const fullTts = currentLevel === 3
                ? `${item.cTts}, ${item.vTts}, อ่านว่า, ${item.cSound} ${item.vSound} ${item.word}`
                : `${item.cSound}, ${item.vSound}, ${item.word}`;

            const t1 = currentLevel === 3 ? 950 : 600;
            const t2 = currentLevel === 3 ? 1950 : 1200;

            slotC.classList.add('highlight');
            speakSmart(voiceKey, fullTts, () => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.remove('highlight');
            });

            activeTimers.push(setTimeout(() => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.add('highlight');
            }, t1));

            activeTimers.push(setTimeout(() => {
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.add('highlight');
            }, t2));
        }

        function stepBlendWord(dir) {
            playPopSound();
            stopAllSpeech();
            if (dir < 0) {
                if (blendHistoryIndex > 0) blendHistoryIndex--;
                else {
                    blendHistory.unshift(generateRandomBlendWord());
                    blendHistoryIndex = 0;
                }
            } else {
                if (blendHistoryIndex < blendHistory.length - 1) blendHistoryIndex++;
                else {
                    blendHistory.push(generateRandomBlendWord());
                    blendHistoryIndex = blendHistory.length - 1;
                }
            }
            renderStage();
        }

        /* ==================== 11. ด่านที่ 5: วรรณยุกต์หรรษา & การผัน 5 เสียง ==================== */
        function renderLevel5Learn(container) {
            setInstruction('🎵 แตะที่รูปวรรณยุกต์ด้านบน หรือแตะกล่องทั้ง 5 ช่องเพื่อฝึกผันวรรณยุกต์จ้า', 'แตะที่รูปวรรณยุกต์ หรือแตะกล่องเพื่อฝึกผันเสียงวรรณยุกต์จ้า');
            const set = toneSets[currentToneSetIndex];
            const toneLabels = ['สามัญ', 'ไม้เอก (◌่)', 'ไม้โท (◌้)', 'ไม้ตรี (◌๊)', 'ไม้จัตวา (◌๋)'];

            const wrapper = document.createElement('div');
            wrapper.className = 'blend-stage';

            let marksHtml = '';
            toneMarks.forEach(m => {
                marksHtml += `
                    <div class="tone-mark-pill" onclick="speakSmart('${m.id}', '${m.tts}')">
                        <div style="font-size:2rem; font-weight:700; color:#F15BB5;">${m.mark}</div>
                        <div style="font-size:0.9rem; font-weight:700;">${m.name}</div>
                    </div>
                `;
            });

            let stepsHtml = '';
            set.words.forEach((w, idx) => {
                stepsHtml += `
                    <div class="tone-step-card" id="tone-step-${idx}" onclick="speakSingleToneStep(${idx})">
                        <div class="tone-word-big">${w}</div>
                        <div class="tone-label-small">${toneLabels[idx]}</div>
                    </div>
                `;
            });

            wrapper.innerHTML = `
                <div class="tone-marks-bar">${marksHtml}</div>
                <div class="card-progress">ชุดผันเสียงที่ ${currentToneSetIndex + 1} / ${toneSets.length} (${showImages ? set.emoji + ' ' + set.sampleWord : set.base})</div>
                <div class="tone-steps-row">${stepsHtml}</div>
                <div class="phonetic-banner" onclick="playAllToneSteps()">
                    📢 แตะเพื่อผัน 5 เสียง: "${set.words.join(' - ')}" ${recordedKeys.has(set.id) ? '🎙️' : ''}
                </div>
                <div class="word-nav">
                    <button class="action-btn btn-prev" onclick="stepToneSet(-1)">⬅️ คำก่อนหน้า</button>
                    <button class="action-btn btn-speak-all" onclick="playAllToneSteps()">🔊 ผันครบ 5 เสียง</button>
                    <button class="action-btn btn-next" onclick="stepToneSet(1)">คำถัดไป ➡️</button>
                </div>
            `;
            container.appendChild(wrapper);
        }

        function speakSingleToneStep(idx) {
            playPopSound();
            const set = toneSets[currentToneSetIndex];
            document.querySelectorAll('.tone-step-card').forEach(el => el.classList.remove('highlight'));
            const card = document.getElementById(`tone-step-${idx}`);
            if (card) card.classList.add('highlight');
            speakSmart(null, set.words[idx], () => {
                if (card) card.classList.remove('highlight');
            });
        }

        function playAllToneSteps() {
            playPopSound();
            const set = toneSets[currentToneSetIndex];
            document.querySelectorAll('.tone-step-card').forEach(el => el.classList.remove('highlight'));

            const step0 = document.getElementById('tone-step-0');
            if (step0) step0.classList.add('highlight');

            speakSmart(set.id, set.ttsAll, () => {
                document.querySelectorAll('.tone-step-card').forEach(el => el.classList.remove('highlight'));
            });

            [1, 2, 3, 4].forEach(idx => {
                activeTimers.push(setTimeout(() => {
                    document.querySelectorAll('.tone-step-card').forEach(el => el.classList.remove('highlight'));
                    const el = document.getElementById(`tone-step-${idx}`);
                    if (el) el.classList.add('highlight');
                }, idx * 620));
            });
        }

        function stepToneSet(dir) {
            playPopSound();
            stopAllSpeech();
            currentToneSetIndex = (currentToneSetIndex + dir + toneSets.length) % toneSets.length;
            renderStage();
        }

        /* ==================== 12. ด่านที่ 6: หัดอ่านประโยค สไตล์ มานะ-มานี ==================== */
        function getFilteredStories() {
            return stories.filter(s => s.diff === currentStoryDiff);
        }

        function renderLevel6Learn(container) {
            setInstruction('📖 แตะที่บรรทัดเพื่อฟังเสียงอ่านทีละบรรทัด หรือกดปุ่มสีเขียวเพื่ออ่านทั้งหน้าจ้า', 'แตะที่บรรทัดเพื่อฟังเสียงอ่านทีละบรรทัดนะจ๊ะ');
            const list = getFilteredStories();
            if (currentStoryIndex >= list.length) currentStoryIndex = 0;
            const story = list[currentStoryIndex];

            const stage = document.createElement('div');
            stage.className = 'story-stage';

            let linesHtml = '';
            story.lines.forEach((line, idx) => {
                const lineKey = `${story.id}_line_${idx}`;
                linesHtml += `
                    <div class="story-line" id="story-line-${idx}" onclick="readStoryLine(${idx})">
                        <span>🔊</span>
                        <span>${line}</span>
                        ${recordedKeys.has(lineKey) ? '<span style="font-size:1rem;">🎙️</span>' : ''}
                    </div>
                `;
            });

            stage.innerHTML = `
                <div class="blend-filter-bar">
                    <button class="filter-chip ${currentStoryDiff === 1 ? 'active' : ''}" onclick="setStoryDifficulty(1)">⭐ ระดับ 1 (ง่ายมาก)</button>
                    <button class="filter-chip ${currentStoryDiff === 2 ? 'active' : ''}" onclick="setStoryDifficulty(2)">⭐⭐ ระดับ 2 (ปานกลาง)</button>
                    <button class="filter-chip ${currentStoryDiff === 3 ? 'active' : ''}" onclick="setStoryDifficulty(3)">⭐⭐⭐ ระดับ 3 (ผสมวรรณยุกต์)</button>
                </div>

                <div class="story-book">
                    <div class="story-header">
                        <span class="story-title">📕 ${story.title}</span>
                        <span class="card-progress">หน้าที่ ${currentStoryIndex + 1} / ${list.length}</span>
                    </div>
                    ${showImages ? `<div class="story-scene-emoji">${story.emoji}</div>` : ''}
                    <div class="story-lines-box">${linesHtml}</div>
                </div>

                <div class="word-nav">
                    <button class="action-btn btn-prev" onclick="stepStoryPage(-1)">⬅️ หน้าก่อนหน้า</button>
                    <button class="action-btn btn-speak-all" onclick="readFullStoryPage()">🔊 อ่านให้ฟังทั้งหน้า</button>
                    <button class="action-btn btn-next" onclick="stepStoryPage(1)">หน้าถัดไป ➡️</button>
                </div>
            `;
            container.appendChild(stage);
        }

        function setStoryDifficulty(diff) {
            playPopSound();
            stopAllSpeech();
            currentStoryDiff = diff;
            currentStoryIndex = 0;
            renderStage();
        }

        function stepStoryPage(dir) {
            playPopSound();
            stopAllSpeech();
            const list = getFilteredStories();
            currentStoryIndex = (currentStoryIndex + dir + list.length) % list.length;
            renderStage();
        }

        function readStoryLine(idx) {
            playPopSound();
            const story = getFilteredStories()[currentStoryIndex];
            if (!story) return;

            document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
            const lineEl = document.getElementById(`story-line-${idx}`);
            if (lineEl) lineEl.classList.add('reading-now');

            const lineKey = `${story.id}_line_${idx}`;
            const ttsText = story.lines[idx];
            speakSmart(lineKey, ttsText, () => {
                if (lineEl) lineEl.classList.remove('reading-now');
            });
        }

        function readFullStoryPage() {
            playPopSound();
            const story = getFilteredStories()[currentStoryIndex];
            if (!story) return;

            let idx = 0;
            const readNext = () => {
                if (idx >= story.lines.length) {
                    document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
                    return;
                }
                document.querySelectorAll('.story-line').forEach(el => el.classList.remove('reading-now'));
                const lineEl = document.getElementById(`story-line-${idx}`);
                if (lineEl) lineEl.classList.add('reading-now');

                const lineKey = `${story.id}_line_${idx}`;
                const lineText = story.lines[idx];
                idx++;
                speakSmart(lineKey, lineText, () => {
                    activeTimers.push(setTimeout(readNext, 300));
                });
            };
            readNext();
        }

        /* ==================== 13. โหมดจับคู่ (ไม่พูดซ้ำ & ล้างหน้าจอฉลองไม่ให้บีบแคบ) ==================== */
        let selectedLeft = null;
        let selectedRight = null;
        let matchedPairsCount = 0;

        function renderMatchGame(container) {
            container.innerHTML = '';
            selectedLeft = null;
            selectedRight = null;
            matchedPairsCount = 0;

            let pool = [];
            if (currentLevel === 1) {
                setInstruction('🧩 แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ', 'แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ');
                pool = [...consonants].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.char, rightText: `${x.emoji} ${x.name}`, ttsLeft: x.sound, ttsRight: x.tts
                }));
            } else if (currentLevel === 2) {
                setInstruction('🧩 จับคู่รูปสระ กับชื่อสระให้ถูกต้องนะจ๊ะ', 'จับคู่รูปสะ-ระ กับชื่อสะ-ระให้ถูกต้องนะจ๊ะ');
                pool = [...vowels].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.display, rightText: x.name, ttsLeft: x.sound, ttsRight: x.tts
                }));
            } else if (currentLevel === 5) {
                setInstruction('🧩 จับคู่คำที่มีวรรณยุกต์ กับภาพความหมายให้ตรงกันจ้า', 'จับคู่คำวรรณยุกต์ กับภาพความหมายให้ตรงกันจ้า');
                pool = [...toneSets].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.targetWord, rightText: `${x.emoji} ${x.sampleWord}`, ttsLeft: x.targetWord, ttsRight: x.sampleWord
                }));
            } else if (currentLevel === 6) {
                setInstruction('🧩 จับคู่ประโยคสั้นๆ กับภาพเหตุการณ์ให้ตรงกันจ้า', 'จับคู่ประโยค กับภาพให้ตรงกันจ้า');
                pool = [...stories].sort(() => 0.5 - Math.random()).slice(0, 4).map(s => ({
                    id: s.id, leftText: s.lines[0], rightText: `${s.emoji} ${s.title.replace(/บทที่ \S+ /, '')}`, ttsLeft: s.lines[0], ttsRight: s.title.replace(/บทที่ \S+ /, '')
                }));
            } else {
                // ด่าน 3 และ 4: ฝั่งขวาอ่านเต็มคำ เช่น "ทุ่งนา", "อีกา", "ดวงตา"
                setInstruction('🧩 จับคู่คำอ่านฝั่งซ้าย กับความหมายฝั่งขวาให้ตรงกันจ้า', 'จับคู่คำอ่าน กับความหมายให้ตรงกันจ้า');
                const randomCurated = [...curatedBlendWords].sort(() => 0.5 - Math.random()).slice(0, 4);
                pool = randomCurated.map(pick => {
                    const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                    const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                    const b = buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                    return {
                        id: b.id,
                        leftText: b.word,
                        rightText: `${b.emoji} ${b.meaning}`,
                        ttsLeft: `${b.cSound} ${b.vSound} ${b.word}`,
                        ttsRight: b.meaning // อ่านเต็มคำ เช่น "ทุ่งนา"
                    };
                });
            }

            const leftItems = [...pool].sort(() => 0.5 - Math.random());
            const rightItems = [...pool].sort(() => 0.5 - Math.random());

            const board = document.createElement('div');
            board.className = 'match-board';

            const cols = document.createElement('div');
            cols.className = 'match-columns';

            const colL = document.createElement('div');
            colL.className = 'match-col';
            const colR = document.createElement('div');
            colR.className = 'match-col';

            leftItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                if (currentLevel === 6) card.style.fontSize = '1.25rem';
                card.innerText = item.leftText;
                card.onclick = () => selectMatchCard('left', card, item);
                colL.appendChild(card);
            });

            rightItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.style.fontSize = '1.2rem';
                card.innerText = item.rightText;
                card.onclick = () => selectMatchCard('right', card, item);
                colR.appendChild(card);
            });

            cols.appendChild(colL);
            cols.appendChild(colR);
            board.appendChild(cols);
            container.appendChild(board);
        }

        // Logic การออกเสียงโหมดจับคู่แบบไม่พูดซ้ำ: กดใบไหน พูดเฉพาะเสียงใบที่เพิ่งกด 1 ครั้งเดียวจบ
        function selectMatchCard(side, cardEl, item) {
            playPopSound();
            const clickedTts = side === 'left' ? item.ttsLeft : item.ttsRight;

            if (side === 'left') {
                if (selectedLeft) selectedLeft.el.classList.remove('selected');
                selectedLeft = { el: cardEl, item };
                cardEl.classList.add('selected');
            } else {
                if (selectedRight) selectedRight.el.classList.remove('selected');
                selectedRight = { el: cardEl, item };
                cardEl.classList.add('selected');
            }

            // กรณีเพิ่งเลือกใบแรกใบเดียว -> อ่านเสียงของใบที่เพิ่งกดทันที
            if (!selectedLeft || !selectedRight) {
                speakSmart(null, clickedTts);
                return;
            }

            // กรณีเลือกครบ 2 ใบแล้ว -> ตรวจสอบผล
            const left = selectedLeft;
            const right = selectedRight;
            selectedLeft = null;
            selectedRight = null;

            if (left.item.id === right.item.id) {
                left.el.classList.remove('selected');
                right.el.classList.remove('selected');
                left.el.classList.add('matched');
                right.el.classList.add('matched');
                playSuccessSound();
                matchedPairsCount++;

                // พูดเฉพาะเสียงของการ์ดใบที่ 2 ที่เพิ่งจิ้มเพียง 1 ครั้งเดียว (ไม่พูดทวนซ้ำ)
                speakSmart(null, clickedTts, () => {
                    if (matchedPairsCount === 4) {
                        addStar();
                        showTransitionScreen('จับคู่ครบแล้ว เก่งมากจ้า!', () => {
                            renderMatchGame(document.getElementById('game-content'));
                        });
                    }
                });
            } else {
                left.el.classList.add('wrong');
                right.el.classList.add('wrong');
                playWrongSound();
                setTimeout(() => {
                    left.el.classList.remove('selected', 'wrong');
                    right.el.classList.remove('selected', 'wrong');
                }, 450);
            }
        }

        /* ==================== 14. โหมดทายเสียง (ครบทั้ง 6 ด่าน & ล้างหน้าจอทีละข้อ) ==================== */
        function renderQuiz(container) {
            container.innerHTML = '';

            let choices = [];
            let answer = null;
            let displayQuestion = '';
            let ttsQuestion = '';
            let voiceKeyToUse = null;

            if (currentLevel === 1) {
                choices = [...consonants].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else if (currentLevel === 2) {
                choices = [...vowels].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else if (currentLevel === 5) {
                choices = [...toneSets].sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: คำไหนคือคำว่า "${answer.targetWord}" (${answer.sampleWord}) จ๊ะ?`;
                ttsQuestion = `คำไหนคือคำว่า ${answer.targetWord} จ๊ะ`;
            } else if (currentLevel === 6) {
                const allLines = [];
                stories.forEach(s => s.lines.forEach(l => allLines.push({ id: l, text: l, emoji: s.emoji })));
                choices = allLines.sort(() => 0.5 - Math.random()).slice(0, 3);
                answer = choices[Math.floor(Math.random() * choices.length)];
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ประโยคไหนอ่านว่า "${answer.text}" จ๊ะ?`;
                ttsQuestion = answer.text;
            } else {
                const pickedRaw = [...curatedBlendWords].sort(() => 0.5 - Math.random()).slice(0, 3);
                choices = pickedRaw.map(pick => {
                    const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                    const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                    return buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                });
                answer = choices[Math.floor(Math.random() * choices.length)];

                if (currentLevel === 3) {
                    displayQuestion = `ข้อที่ ${quizQuestionNumber}: ${answer.cName} ${answer.vName} อ่านว่า ${answer.cSound} ${answer.vSound} ${answer.word}`;
                    ttsQuestion = `${answer.cTts}, ${answer.vTts}, อ่านว่า, ${answer.cSound} ${answer.vSound} ${answer.word}`;
                    voiceKeyToUse = `${answer.id}_lv3`;
                } else {
                    displayQuestion = `ข้อที่ ${quizQuestionNumber}: คำว่า "${answer.cSound} - ${answer.vSound} - ${answer.word}" คือข้อไหนจ๊ะ?`;
                    ttsQuestion = `${answer.cSound}, ${answer.vSound}, ${answer.word}`;
                    voiceKeyToUse = `${answer.id}_lv4`;
                }
            }

            setInstruction(displayQuestion, ttsQuestion);

            const quizWrapper = document.createElement('div');
            quizWrapper.className = 'quiz-area';

            const counterBadge = document.createElement('div');
            counterBadge.className = 'quiz-counter';
            counterBadge.innerText = `🎯 ข้อที่ ${quizQuestionNumber}`;

            const soundBtn = document.createElement('button');
            soundBtn.className = 'sound-prompt-btn';
            soundBtn.innerHTML = '🔊';
            soundBtn.onclick = () => speakSmart(voiceKeyToUse, ttsQuestion);

            const choicesBox = document.createElement('div');
            choicesBox.className = 'quiz-choices';

            choices.forEach(item => {
                const card = document.createElement('div');
                card.className = 'choice-card';

                if (currentLevel === 1) {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}">${item.char}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                } else if (currentLevel === 2) {
                    card.innerHTML = `
                        <div class="char-big" style="color:#00A8FF;">${item.display}</div>
                        ${showImages ? `<div class="char-label" style="margin-top:8px; font-size:0.88rem;">${item.desc}</div>` : ''}
                    `;
                } else if (currentLevel === 5) {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}" style="color:#F15BB5;">${item.targetWord}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                } else if (currentLevel === 6) {
                    card.style.width = '240px';
                    card.style.minHeight = '105px';
                    card.innerHTML = `
                        <div style="font-size:1.45rem; font-weight:700; color:#2C3E50;">${item.text}</div>
                        ${showImages ? `<div style="font-size:1.6rem; margin-top:4px;">${item.emoji}</div>` : ''}
                    `;
                } else {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}" style="color:#2ED573;">${item.word}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                }

                card.onclick = () => handleQuizChoice(card, item, answer);
                choicesBox.appendChild(card);
            });

            quizWrapper.appendChild(counterBadge);
            quizWrapper.appendChild(soundBtn);
            quizWrapper.appendChild(choicesBox);
            container.appendChild(quizWrapper);

            activeTimers.push(setTimeout(() => speakSmart(voiceKeyToUse, ttsQuestion), 280));
        }

        function handleQuizChoice(cardEl, selected, answer) {
            if (selected.id === answer.id) {
                playSuccessSound();
                addStar();
                quizQuestionNumber++;
                showTransitionScreen('ถูกต้องจ้า เก่งมากเลย!', () => {
                    renderQuiz(document.getElementById('game-content'));
                });
            } else {
                if (cardEl.classList.contains('wrong')) return;
                cardEl.classList.add('wrong');
                playWrongSound();
                speakSmart(null, 'ลองดูใหม่อีกทีนะจ๊ะ', () => {
                    setTimeout(() => cardEl.classList.remove('wrong'), 400);
                });
            }
        }

        // หน้าจอคั่นเวลาจบข้อ: ล้างตัวเองทิ้งทั้งหมดเมื่อครบเวลา เพื่อไม่ให้หน้าจอบีบแคบ
        function showTransitionScreen(message, onComplete) {
            const container = document.getElementById('game-content');
            container.innerHTML = `
                <div class="transition-screen">
                    <div class="transition-emoji">🌟🎉🌟</div>
                    <div class="transition-text">${message}</div>
                </div>
            `;
            speakSmart(null, 'เก่งมากจ้า', () => {
                activeTimers.push(setTimeout(() => {
                    container.innerHTML = '';
                    if (onComplete) onComplete();
                }, 400));
            });
        }

        /* ==================== 15. สตูดิโออัดเสียงผู้ปกครอง ==================== */
        let mediaRecorder = null;
        let audioChunks = [];
        let currentlyRecordingKey = null;

        function getAllRecordableItems() {
            const list = [];
            consonants.forEach(c => list.push({ key: c.id, label: `[ด่าน 1] ${c.char} - ${c.name}`, defaultTts: c.tts }));
            vowels.forEach(v => list.push({ key: v.id, label: `[ด่าน 2] ${v.display} - ${v.name}`, defaultTts: v.tts }));
            curatedBlendWords.forEach(pick => {
                const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                const w = buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
                list.push({
                    key: `${w.id}_lv3`,
                    label: `[ด่าน 3] ${w.word} ("${w.cName} ${w.vName} อ่านว่า ${w.cSound} ${w.vSound} ${w.word}")`,
                    defaultTts: `${w.cTts}, ${w.vTts}, อ่านว่า, ${w.cSound} ${w.vSound} ${w.word}`
                });
                list.push({
                    key: `${w.id}_lv4`,
                    label: `[ด่าน 4] ${w.word} ("${w.cSound} ${w.vSound} ${w.word}")`,
                    defaultTts: `${w.cSound}, ${w.vSound}, ${w.word}`
                });
            });
            toneSets.forEach(t => list.push({ key: t.id, label: `[ด่าน 5] ผันเสียง: ${t.words.join('-')}`, defaultTts: t.ttsAll }));
            stories.forEach(s => {
                s.lines.forEach((line, idx) => {
                    list.push({ key: `${s.id}_line_${idx}`, label: `[ด่าน 6 ${s.title}] "${line}"`, defaultTts: line });
                });
            });
            return list;
        }

        function openVoiceStudio() {
            stopAllSpeech();
            document.getElementById('voice-modal').classList.add('show');
            renderVoiceStudioList();
        }

        function closeVoiceStudio() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            document.getElementById('voice-modal').classList.remove('show');
            renderStage();
        }

        function renderVoiceStudioList() {
            const listEl = document.getElementById('voice-studio-list');
            listEl.innerHTML = '';
            getAllRecordableItems().forEach(item => {
                const hasRecorded = recordedKeys.has(item.key);
                const isRec = currentlyRecordingKey === item.key;
                const row = document.createElement('div');
                row.className = 'voice-item';
                row.innerHTML = `
                    <div class="voice-item-title">${hasRecorded ? '✅' : '⚪'} ${item.label}</div>
                    <div class="voice-controls">
                        <button class="rec-btn ${isRec ? 'recording' : 'record'}" onclick="toggleRecord('${item.key}')">
                            ${isRec ? '⏹️ หยุดอัด' : '🎙️ อัดเสียง'}
                        </button>
                        <button class="rec-btn play" onclick="speakSmart('${item.key}', '${item.defaultTts}')">🔊 ฟัง</button>
                        ${hasRecorded ? `<button class="rec-btn delete" onclick="removeRecording('${item.key}')">🗑️ ลบ</button>` : ''}
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        async function toggleRecord(key) {
            if (currentlyRecordingKey === key && mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                currentlyRecordingKey = key;
                renderVoiceStudioList();

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    await saveVoiceBlob(key, blob);
                    stream.getTracks().forEach(t => t.stop());
                    currentlyRecordingKey = null;
                    renderVoiceStudioList();
                };
                mediaRecorder.start();
            } catch (err) {
                alert('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตการใช้ไมโครโฟนบนเบราว์เซอร์ครับ');
                currentlyRecordingKey = null;
                renderVoiceStudioList();
            }
        }

        async function removeRecording(key) {
            await deleteVoiceBlob(key);
            renderVoiceStudioList();
        }

        /* ==================== 16. พลุกระดาษ (CONFETTI) ==================== */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#9B5DE5', '#00BBF9', '#2ED573'];
            for (let i = 0; i < 55; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 16 - 4,
                    size: Math.random() * 9 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45;
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) confettiParticles.splice(index, 1);
            });

            if (confettiParticles.length > 0) requestAnimationFrame(updateConfetti);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { getBestThaiVoice(); };
        }

        window.onload = async () => {
            await initDB();
            ensureInitialBlendWord();
            renderStage();
        };
    </script>
