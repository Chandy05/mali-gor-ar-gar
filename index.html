<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมหรรษา พยัญชนะ สระ วรรณยุกต์ และหัดอ่านมานะ-มานี</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --purple: #9B5DE5;
            --blue: #00BBF9;
            --green: #2ED573;
            --orange: #FF9F1C;
            --pink: #F15BB5;
            --dark: #2C3E50;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Mali', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: var(--dark);
        }

        header {
            width: 100%;
            max-width: 980px;
            padding: 10px 14px 4px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .game-title {
            margin: 0;
            font-size: 1.45rem;
            color: #FF4757;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
        }

        .utility-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .util-btn {
            padding: 6px 11px;
            border: 3px solid var(--white);
            border-radius: 16px;
            font-family: 'Mali', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 3px 0 rgba(0,0,0,0.12);
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .util-btn.active-toggle {
            background: #FFEAA7;
            border-color: #FDCB6E;
        }

        .util-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.12);
        }

        .level-nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            width: 100%;
            margin-top: 2px;
        }

        @media (min-width: 680px) {
            .level-nav {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .level-btn {
            padding: 9px 10px;
            border: 3px solid var(--white);
            border-radius: 18px;
            font-family: 'Mali', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 5px;
        }

        .level-btn:active, .level-btn.active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
            border-color: var(--accent);
            outline: 3px solid #FF4757;
        }

        .btn-lv1 { background-color: #FF6B6B; }
        .btn-lv2 { background-color: #4ECDC4; }
        .btn-lv3 { background-color: #FF9F1C; }
        .btn-lv4 { background-color: #9B5DE5; }
        .btn-lv5 { background-color: #F15BB5; }
        .btn-lv6 { background-color: #2ED573; }

        /* Stage Container */
        .stage-container {
            width: 95%;
            max-width: 940px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            border: 5px solid var(--white);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            padding: 16px;
            margin: 6px 0 28px 0;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mode-switch {
            display: flex;
            background: #F1F2F6;
            border-radius: 16px;
            padding: 4px;
            gap: 4px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-family: 'Mali', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #747D8C;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        .score-box {
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFA502;
            background: #FFF9E6;
            padding: 5px 14px;
            border-radius: 16px;
            border: 3px solid #FFEAA7;
        }

        .instruction-bar {
            background: #FFEAA7;
            color: var(--dark);
            padding: 9px 16px;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #FDCB6E;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .instruction-bar:active {
            transform: scale(0.98);
        }

        #game-content {
            width: 100%;
            display: block;
        }

        /* Single Flashcard View */
        .single-card-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            padding: 4px 0;
            animation: fadeIn 0.2s ease-out;
        }

        .card-progress {
            background: #F1F2F6;
            color: #57606F;
            padding: 4px 14px;
            border-radius: 14px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .flashcard-box {
            width: 100%;
            max-width: 330px;
            min-height: 250px;
            background: var(--white);
            border: 6px solid #FF6B6B;
            border-radius: 32px;
            box-shadow: 0 10px 0 #FF6B6B, 0 15px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background-color 0.2s;
            position: relative;
        }

        .flashcard-box.vowel-theme {
            border-color: #00A8FF;
            box-shadow: 0 10px 0 #00A8FF, 0 15px 25px rgba(0,0,0,0.1);
        }

        .flashcard-box:active, .flashcard-box.speaking {
            transform: translateY(5px) scale(1.02);
            background: #FFF9E6;
            border-color: #FFA502;
            box-shadow: 0 5px 0 #FFA502;
        }

        .flashcard-char {
            font-size: 5.8rem;
            font-weight: 700;
            line-height: 1.05;
            color: var(--dark);
        }

        .flashcard-char.no-img-mode {
            font-size: 7.4rem;
            margin: 12px 0;
        }

        .flashcard-emoji {
            font-size: 4.2rem;
            margin: 5px 0;
        }

        .flashcard-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 4px;
        }

        .flashcard-sub {
            font-size: 1rem;
            font-weight: 700;
            color: #747D8C;
            margin-top: 4px;
            text-align: center;
        }

        /* Grid View */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding: 4px 0;
        }

        @media (min-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .char-card {
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 22px;
            padding: 12px 8px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #70A1FF;
            transition: transform 0.15s, border-color 0.2s;
        }

        .char-card:active, .char-card.speaking {
            transform: translateY(4px) scale(1.03);
            border-color: var(--primary);
            background: #FFF5F5;
            box-shadow: 0 2px 0 var(--primary);
        }

        .char-big {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.1;
            color: var(--dark);
        }

        .char-big.no-img-mode {
            font-size: 4.2rem;
            margin: 6px 0;
        }

        .char-emoji {
            font-size: 2.3rem;
            margin: 4px 0;
        }

        .char-label {
            font-size: 0.98rem;
            font-weight: 700;
            color: #2C3E50;
            text-align: center;
        }

        /* Level 3 & 4 Equation Box */
        .blend-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
        }

        .blend-filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-chip {
            padding: 6px 13px;
            border-radius: 15px;
            border: 2px solid #DFE4EA;
            background: var(--white);
            font-family: 'Mali', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #57606F;
            cursor: pointer;
        }

        .filter-chip.active {
            background: #ECCC68;
            border-color: #FFA502;
            color: var(--dark);
        }

        .equation-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            padding: 15px 10px;
            background: #F8F9FA;
            border-radius: 24px;
            border: 4px dashed #CED6E0;
        }

        .eq-slot {
            min-width: 96px;
            height: 132px;
            padding: 8px 12px;
            background: var(--white);
            border: 5px solid #A4B0BE;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #A4B0BE;
            transition: all 0.2s;
        }

        .eq-slot.consonant-slot { border-color: #FF6B6B; box-shadow: 0 5px 0 #FF6B6B; }
        .eq-slot.vowel-slot { border-color: #4ECDC4; box-shadow: 0 5px 0 #4ECDC4; }
        .eq-slot.result-slot { min-width: 125px; border-color: #FFA502; box-shadow: 0 5px 0 #FFA502; background: #FFFDF0; }

        .eq-slot.highlight {
            transform: scale(1.08) translateY(-4px);
            background: #FFEAA7;
            border-color: #FF4757;
            box-shadow: 0 8px 18px rgba(255, 71, 87, 0.35);
            z-index: 5;
        }

        .eq-symbol {
            font-size: 1.9rem;
            font-weight: 700;
            color: #747D8C;
        }

        .slot-main-text {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .slot-sub-text {
            font-size: 0.92rem;
            color: #57606F;
            font-weight: 700;
            margin-top: 5px;
            text-align: center;
        }

        .phonetic-banner {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--purple);
            background: #F3E8FF;
            padding: 10px 16px;
            border-radius: 18px;
            border: 3px solid #D8B4FE;
            text-align: center;
            width: 100%;
            cursor: pointer;
        }

        .word-nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .action-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            font-family: 'Mali', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }

        .btn-speak-all { background: #2ED573; }
        .btn-next { background: #1E90FF; }
        .btn-random { background: #FF9F1C; }
        .btn-prev { background: #747D8C; }

        /* Level 5: Tone Marks & 5-Tone Board */
        .tone-marks-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            margin-bottom: 6px;
        }

        .tone-mark-pill {
            background: #FFF0F6;
            border: 3px solid #F15BB5;
            border-radius: 18px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #F15BB5;
            transition: 0.15s;
        }

        .tone-mark-pill:active, .tone-mark-pill.highlight {
            transform: translateY(3px);
            background: #FFEAA7;
        }

        .tone-steps-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            padding: 12px 8px;
            background: #F8F9FA;
            border-radius: 24px;
            border: 3px dashed #CED6E0;
        }

        .tone-step-card {
            background: var(--white);
            border: 4px solid #9B5DE5;
            border-radius: 20px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 #9B5DE5;
            transition: 0.2s;
        }

        .tone-step-card.highlight {
            transform: translateY(-6px) scale(1.06);
            background: #FFEAA7;
            border-color: #FF4757;
            box-shadow: 0 8px 15px rgba(255,71,87,0.3);
        }

        .tone-word-big {
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        .tone-label-small {
            font-size: 0.8rem;
            color: #57606F;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Level 6: Mana Manee Story Reader */
        .story-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            animation: fadeIn 0.25s;
        }

        .story-book {
            width: 100%;
            max-width: 680px;
            background: #FFFDF7;
            border: 5px solid #E6CCB2;
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 10px 0 #DDB892, 0 14px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .story-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            border-bottom: 2px dashed #E6CCB2;
            padding-bottom: 8px;
        }

        .story-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #9C6644;
        }

        .story-scene-emoji {
            font-size: 3.4rem;
            background: #F8F4E8;
            padding: 8px 24px;
            border-radius: 20px;
        }

        .story-lines-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .story-line {
            width: 100%;
            background: var(--white);
            border: 3px solid #EDE0D4;
            border-radius: 18px;
            padding: 12px 18px;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--dark);
            text-align: center;
            letter-spacing: 0.5px;
            word-spacing: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #EDE0D4;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .story-line:active, .story-line.reading-now {
            background: #FFEAA7;
            border-color: #FFA502;
            box-shadow: 0 4px 0 #FFA502;
            transform: scale(1.02);
            color: #D35400;
        }

        /* Matching Mode (Full Width Fix) */
        .match-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 14px;
            animation: fadeIn 0.25s;
        }

        .match-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            max-width: 680px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .match-card {
            width: 100%;
            min-height: 82px;
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 20px;
            box-shadow: 0 5px 0 #70A1FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            padding: 8px;
            text-align: center;
        }

        .match-card.selected {
            background: #FFEAA7;
            border-color: #FFA502;
            box-shadow: 0 5px 0 #FFA502;
            transform: scale(1.03);
        }

        .match-card.matched {
            background: #7BED9F;
            border-color: #2ED573;
            box-shadow: 0 3px 0 #2ED573;
            opacity: 0.4;
            pointer-events: none;
            transform: scale(0.96);
        }

        .match-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            animation: shake 0.4s;
        }

        /* Quiz Mode */
        .quiz-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
            margin: 4px 0;
            animation: fadeIn 0.25s ease-out;
        }

        .quiz-counter {
            background: #ECCC68;
            color: var(--dark);
            padding: 4px 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
        }

        .sound-prompt-btn {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: #FF6B6B;
            border: 5px solid var(--white);
            box-shadow: 0 6px 0 #EE5253, 0 10px 18px rgba(0,0,0,0.15);
            font-size: 2.8rem;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        .quiz-choices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .choice-card {
            width: 145px;
            min-height: 155px;
            background: var(--white);
            border: 5px solid #70A1FF;
            border-radius: 24px;
            box-shadow: 0 6px 0 #70A1FF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            padding: 10px;
            text-align: center;
        }

        .choice-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            box-shadow: 0 6px 0 #FF4757;
            animation: shake 0.4s;
        }

        .transition-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            gap: 12px;
            animation: fadeIn 0.2s;
        }

        .transition-emoji {
            font-size: 4.5rem;
            animation: bounce 0.6s infinite;
        }

        .transition-text {
            font-size: 1.65rem;
            font-weight: 700;
            color: #2ED573;
            text-align: center;
        }

        /* Voice Studio Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--white);
            width: 100%;
            max-width: 720px;
            max-height: 85vh;
            border-radius: 26px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #F1F2F6;
            padding-bottom: 10px;
        }

        .modal-body {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .voice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: #F8F9FA;
            border-radius: 14px;
            border: 2px solid #DFE4EA;
            flex-wrap: wrap;
            gap: 8px;
        }

        .voice-item-title { font-size: 0.95rem; font-weight: 700; }
        .voice-controls { display: flex; gap: 6px; align-items: center; }

        .rec-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-family: 'Mali', sans-serif;
            font-weight: 700;
            cursor: pointer;
            color: var(--white);
            font-size: 0.85rem;
        }

        .rec-btn.record { background: #FF4757; }

        function buildBlendObject(cObj, vObj, customMeaning = '', customEmoji = '✨') {
            const wordStr = vObj.template.replace('{c}', cObj.char);
            return {

                cName: cObj.name,
                cTts: cObj.tts,

                vName: vObj.name,
                vTts: vObj.tts,

        function generateRandomBlendWord() {
            const lastWord = blendHistoryIndex >= 0 ? blendHistory[blendHistoryIndex].word : '';
            if (blendPoolMode === 'easy') {
                let maxTier = 1;
                if (easyWordsGeneratedCount >= 5) maxTier = 2;
                if (easyWordsGeneratedCount >= 12) maxTier = 3;
                let candidates = curatedBlendWords.filter(w => w.tier <= maxTier && w.word !== lastWord);
                if (candidates.length === 0) candidates = curatedBlendWords;
                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                const cObj = consonants.find(c => c.char === pick.cChar) || consonants[0];
                const vObj = vowels.find(v => v.id === pick.vId) || vowels[1];
                easyWordsGeneratedCount++;
                return buildBlendObject(cObj, vObj, pick.meaning, pick.emoji);
            } else {
                const cPool = consonants.filter(c => c.easy);
                const vPool = vowels.filter(v => v.easy);
                const cObj = cPool[Math.floor(Math.random() * cPool.length)];
                const vObj = vPool[Math.floor(Math.random() * vPool.length)];
                const matchCurated = curatedBlendWords.find(w => w.cChar === cObj.char && w.vId === vObj.id);
                if (matchCurated) return buildBlendObject(cObj, vObj, matchCurated.meaning, matchCurated.emoji);
                return buildBlendObject(cObj, vObj, `ฝึกสะกดคำ`, cObj.emoji);
            }
        }

        function ensureInitialBlendWord() {

        /* ==================== 6. ระบบฐานข้อมูลเสียงผู้ปกครอง (IndexedDB) ==================== */
        let db;
        const recordedKeys = new Set();

        function initDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('ThaiKidsVoiceDB', 1);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('voices')) {
                        database.createObjectStore('voices');
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    loadRecordedKeys().then(resolve);
                };
                request.onerror = () => resolve();
            });
        }

        function loadRecordedKeys() {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction('voices', 'readonly');
                const req = tx.objectStore('voices').getAllKeys();
                req.onsuccess = () => {
                    recordedKeys.clear();
                    req.result.forEach(k => recordedKeys.add(k));
                    resolve();
                };
                req.onerror = () => resolve();
            });
        }

        function saveVoiceBlob(key, blob) {
            return new Promise((resolve) => {
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').put(blob, key);
                tx.oncomplete = () => { recordedKeys.add(key); resolve(); };
            });
        }

        function getVoiceBlob(key) {
            return new Promise((resolve) => {
                if (!db || !recordedKeys.has(key)) return resolve(null);
                const tx = db.transaction('voices', 'readonly');
                const req = tx.objectStore('voices').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        function deleteVoiceBlob(key) {
            return new Promise((resolve) => {
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').delete(key);
                tx.oncomplete = () => { recordedKeys.delete(key); resolve(); };
            });
        }

        /* ==================== 7. ระบบเสียง 3 ชั้น (แก้ปัญหา Android S22 Ultra ไม่มีเสียง) ==================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let currentAudioElement = null;
        let speechSessionId = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
            initAudio();
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay * 1000);
        }

        function playPopSound() { playTone(520, 'sine', 0.08); }
        function playSuccessSound() {
            playTone(523.25, 'triangle', 0.13, 0);
            playTone(659.25, 'triangle', 0.13, 0.1);
            playTone(783.99, 'triangle', 0.13, 0.2);
            playTone(1046.50, 'triangle', 0.28, 0.3);
        }
        function playWrongSound() {
            playTone(280, 'sawtooth', 0.16, 0);
            playTone(210, 'sawtooth', 0.22, 0.15);
        }

        function toggleVoiceEngineMode() {

            }
        }

        function stopAllSpeech() {
            speechSessionId++;
            clearAllTimers();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (currentAudioElement) {
                currentAudioElement.pause();
                currentAudioElement = null;
            }
        }

        function getBestThaiVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices();
            const thVoices = voices.filter(v => v.lang && (v.lang.toLowerCase().includes('th')));
            if (thVoices.length === 0) return null;

            return thVoices.find(v => v.name.includes('Premwadee') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Niwat') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Premwadee')) ||
                   thVoices.find(v => v.name.includes('Kanya')) ||
                   thVoices.find(v => v.name.includes('Google')) ||
                   thVoices[0];
        }

        // Fallback ออนไลน์สำหรับ Samsung S22 Ultra หรือเครื่องที่ไม่มีชุดเสียงภาษาไทย
        function playCloudThaiTTS(ttsText, mySession, safeCallback) {
            if (mySession !== speechSessionId) return;
            const cleanText = ttsText.replace(/-/g, ' ');
            const url = `https://translate.googleapis.com/translate_tts?client=tw-ob&ie=UTF-8&tl=th&q=${encodeURIComponent(cleanText)}`;
            const audio = new Audio(url);
            currentAudioElement = audio;
            audio.onended = () => safeCallback();
            audio.onerror = () => {
                // หากออนไลน์ถูกบล็อก ให้คลาย callback เพื่อไม่ให้เกมค้าง
                setTimeout(safeCallback, 600);
            };
            audio.play().catch(() => {
                setTimeout(safeCallback, 600);
            });
        }

        async function speakSmart(voiceKey, ttsText, callback) {
            stopAllSpeech();
            const mySession = speechSessionId;
            let callbackCalled = false;

            const safeCallback = () => {
                if (!callbackCalled && mySession === speechSessionId) {
                    callbackCalled = true;
                    if (callback) callback();
                }
            };

            // ชั้นที่ 1: เช็คเสียงที่ผู้ปกครองอัดไว้
            if (voiceKey && recordedKeys.has(voiceKey)) {
                const blob = await getVoiceBlob(voiceKey);
                if (blob && mySession === speechSessionId) {
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    currentAudioElement = audio;
                    audio.onended = () => { URL.revokeObjectURL(url); safeCallback(); };
                    audio.onerror = () => safeCallback();
                    audio.play().catch(() => safeCallback());
                    return;
                }
            }

            // ชั้นที่ 2: หากผู้ใช้เลือกโหมดบังคับเสียงออนไลน์ (สำหรับ S22 Ultra)
            if (forceCloudTts) {
                playCloudThaiTTS(ttsText, mySession, safeCallback);
                return;
            }

            // ชั้นที่ 3: Web Speech API พร้อม Watchdog ตรวจจับอาการเงียบของ Android
            if (!('speechSynthesis' in window)) {
                playCloudThaiTTS(ttsText, mySession, safeCallback);
                return;
            }

            // หน่วง 60ms หลัง cancel() เพื่อแก้บั๊ก Chrome Android ค้าง
            const startTimer = setTimeout(() => {
                if (mySession !== speechSessionId) return;

                const bestVoice = getBestThaiVoice();
                const isAndroid = /Android/i.test(navigator.userAgent);

                // หากเป็น Android และตรวจไม่พบ Voice ภาษาไทยในเครื่องเลย ให้สลับไปใช้ Cloud TTS ทันที
                if (isAndroid && !bestVoice) {
                    playCloudThaiTTS(ttsText, mySession, safeCallback);
                    return;
                }

                const utter = new SpeechSynthesisUtterance(ttsText);
                utter.lang = 'th-TH';
                utter.rate = 0.92;
                utter.pitch = 1.0;
                if (bestVoice) utter.voice = bestVoice;

                let speechStarted = false;
                utter.onstart = () => { speechStarted = true; };
                utter.onend = () => { speechStarted = true; safeCallback(); };
                utter.onerror = () => {
                    if (!speechStarted) {
                        playCloudThaiTTS(ttsText, mySession, safeCallback);
                    } else {
                        safeCallback();
                    }
                };

                window.speechSynthesis.speak(utter);

                // Watchdog: หากผ่านไป 500ms แล้วเครื่อง Android ยังไม่ยอมเริ่มออกเสียง ให้ดึง Cloud TTS มาพูดแทนทันที
                if (isAndroid) {
                    const watchdog = setTimeout(() => {
                        if (!speechStarted && !callbackCalled && mySession === speechSessionId) {
                            window.speechSynthesis.cancel();
                            playCloudThaiTTS(ttsText, mySession, safeCallback);
                        }
                    }, 500);
                    activeTimers.push(watchdog);
                }
            }, 60);

            activeTimers.push(startTimer);
        }

            stars++;

            launchConfetti();
        }

        function renderStage() {
            const container = document.getElementById('game-content');
            container.innerHTML = '';

            if (currentMode === 'learn') {
                if (currentLevel === 1) renderLevel1Learn(container);
                else if (currentLevel === 2) renderLevel2Learn(container);
                else if (currentLevel === 3) renderLevel3And4Learn(container, 3);
                else if (currentLevel === 4) renderLevel3And4Learn(container, 4);
                else if (currentLevel === 5) renderLevel5Learn(container);
                else if (currentLevel === 6) renderLevel6Learn(container);
            } else if (currentMode === 'match') {
                renderMatchGame(container);
            } else if (currentMode === 'quiz') {
                renderQuiz(container);
            }
        }

        /* ==================== 9. โหมดเรียนรู้ ด่าน 1 & 2 (ไม่รันเสียงเองตอนเลื่อน) ==================== */
        function renderLevel1Learn(container) {
            setInstruction('แตะที่กล่องบัตรคำ เพื่อฟังเสียงพยัญชนะนะจ๊ะ', 'แตะที่กล่องบัตรคำ เพื่อฟังเสียงพยัญชนะนะจ๊ะ');
            if (singleCardMode) {
                const item = consonants[currentConsonantIndex];
                const stage = document.createElement('div');
                stage.className = 'single-card-stage';
                stage.innerHTML = `
                    <div class="card-progress">พยัญชนะตัวที่ ${currentConsonantIndex + 1} / ${consonants.length}</div>
                    <div class="flashcard-box" id="main-flashcard" onclick="speakCurrentFlashcard(1)">
                        <div class="flashcard-char ${!showImages ? 'no-img-mode' : ''}">${item.char}</div>
                        ${showImages ? `<div class="flashcard-emoji">${item.emoji}</div>` : ''}
                        <div class="flashcard-title">${item.name} ${recordedKeys.has(item.id) ? '🎙️' : ''}</div>
                    </div>
                    <div class="word-nav">
                        <button class="action-btn btn-prev" onclick="stepFlashcard(1, -1)">⬅️ ตัวก่อนหน้า</button>
                        <button class="action-btn btn-speak-all" onclick="speakCurrentFlashcard(1)">🔊 ฟังเสียง</button>
                        <button class="action-btn btn-next" onclick="stepFlashcard(1, 1)">ตัวถัดไป ➡️</button>
                    </div>
                `;
                container.appendChild(stage);
            } else {
                const grid = document.createElement('div');
                grid.className = 'card-grid';
                consonants.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'char-card';
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}">${item.char}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                        <div class="char-label">${item.name}</div>
                    `;
                    card.onclick = () => {
                        playPopSound();
                        currentConsonantIndex = idx;
                        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('speaking'));
                        card.classList.add('speaking');
                        speakSmart(item.id, item.tts, () => card.classList.remove('speaking'));
                    };
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        }

        function renderLevel2Learn(container) {
            setInstruction('แตะที่กล่องบัตรสระ เพื่อฟังเสียงอ่านจ้า', 'แตะที่กล่องบัตรสะ-ระ เพื่อฟังเสียงอ่านจ้า');
            if (singleCardMode) {
                const item = vowels[currentVowelIndex];
                const stage = document.createElement('div');
                stage.className = 'single-card-stage';
                stage.innerHTML = `
                    <div class="card-progress">สระตัวที่ ${currentVowelIndex + 1} / ${vowels.length}</div>
                    <div class="flashcard-box vowel-theme" id="main-flashcard" onclick="speakCurrentFlashcard(2)">
                        <div class="flashcard-char" style="color: #00A8FF;">${item.display}</div>
                        <div class="flashcard-title">${item.name} ${recordedKeys.has(item.id) ? '🎙️' : ''}</div>
                        ${showImages ? `<div class="flashcard-sub">(${item.desc})</div>` : ''}
                    </div>
                    <div class="word-nav">
                        <button class="action-btn btn-prev" onclick="stepFlashcard(2, -1)">⬅️ สระก่อนหน้า</button>
                        <button class="action-btn btn-speak-all" onclick="speakCurrentFlashcard(2)">🔊 ฟังเสียง</button>
                        <button class="action-btn btn-next" onclick="stepFlashcard(2, 1)">สระถัดไป ➡️</button>
                    </div>
                `;
                container.appendChild(stage);
            } else {
                const grid = document.createElement('div');
                grid.className = 'card-grid';
                vowels.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'char-card';
                    card.innerHTML = `
                        <div class="char-big" style="color: #00A8FF;">${item.display}</div>
                        <div class="char-label" style="margin-top:8px;">${item.name}</div>
                    `;
                    card.onclick = () => {
                        playPopSound();
                        currentVowelIndex = idx;
                        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('speaking'));
                        card.classList.add('speaking');
                        speakSmart(item.id, item.tts, () => card.classList.remove('speaking'));
                    };
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
