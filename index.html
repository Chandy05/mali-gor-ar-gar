<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมหรรษา พยัญชนะและสระไทย</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --purple: #9B5DE5;
            --blue: #00BBF9;
            --green: #2ED573;
            --dark: #2C3E50;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Mali', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: var(--dark);
        }

        header {
            width: 100%;
            max-width: 960px;
            padding: 12px 15px 5px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .game-title {
            margin: 0;
            font-size: 1.6rem;
            color: #FF4757;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
        }

        .utility-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .util-btn {
            padding: 7px 12px;
            border: 3px solid var(--white);
            border-radius: 18px;
            font-family: 'Mali', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 4px 0 rgba(0,0,0,0.12);
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .util-btn.active-toggle {
            background: #FFEAA7;
            border-color: #FDCB6E;
        }

        .util-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.12);
        }

        .level-nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        @media (min-width: 700px) {
            .level-nav {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .level-btn {
            padding: 10px 12px;
            border: 4px solid var(--white);
            border-radius: 20px;
            font-family: 'Mali', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
        }

        .level-btn:active, .level-btn.active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
            border-color: var(--accent);
            outline: 3px solid #FF4757;
        }

        .btn-lv1 { background-color: #FF6B6B; }
        .btn-lv2 { background-color: #4ECDC4; }
        .btn-lv3 { background-color: #FF9F1C; }
        .btn-lv4 { background-color: #9B5DE5; }

        /* Stage Container */
        .stage-container {
            width: 95%;
            max-width: 920px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            border: 6px solid var(--white);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 18px;
            margin: 8px 0 30px 0;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .mode-switch {
            display: flex;
            background: #F1F2F6;
            border-radius: 18px;
            padding: 5px;
            gap: 4px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 7px 13px;
            border: none;
            border-radius: 14px;
            font-family: 'Mali', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #747D8C;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }

        .score-box {
            font-size: 1.15rem;
            font-weight: 700;
            color: #FFA502;
            background: #FFF9E6;
            padding: 6px 14px;
            border-radius: 18px;
            border: 3px solid #FFEAA7;
        }

        .instruction-bar {
            background: #FFEAA7;
            color: var(--dark);
            padding: 10px 18px;
            border-radius: 22px;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #FDCB6E;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .instruction-bar:active {
            transform: scale(0.98);
        }

        /* Single Flashcard View (บัตรคำทีละกล่อง) */
        .single-card-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 18px;
            padding: 5px 0;
            animation: fadeIn 0.25s ease-out;
        }

        .card-progress {
            background: #F1F2F6;
            color: #57606F;
            padding: 4px 16px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 700;
        }

        .flashcard-box {
            width: 100%;
            max-width: 340px;
            min-height: 270px;
            background: var(--white);
            border: 6px solid #FF6B6B;
            border-radius: 35px;
            box-shadow: 0 12px 0 #FF6B6B, 0 18px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background-color 0.2s;
            position: relative;
        }

        .flashcard-box.vowel-theme {
            border-color: #00A8FF;
            box-shadow: 0 12px 0 #00A8FF, 0 18px 30px rgba(0,0,0,0.12);
        }

        .flashcard-box:active, .flashcard-box.speaking {
            transform: translateY(6px) scale(1.02);
            background: #FFF9E6;
            border-color: #FFA502;
            box-shadow: 0 6px 0 #FFA502;
        }

        .flashcard-char {
            font-size: 6.5rem;
            font-weight: 700;
            line-height: 1.05;
            color: var(--dark);
        }

        .flashcard-char.no-img-mode {
            font-size: 8.2rem;
            margin: 15px 0;
        }

        .flashcard-emoji {
            font-size: 4.8rem;
            margin: 6px 0;
        }

        .flashcard-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2C3E50;
            margin-top: 6px;
        }

        .flashcard-sub {
            font-size: 1.1rem;
            font-weight: 700;
            color: #747D8C;
            margin-top: 4px;
        }

        /* Grid View (กรณีต้องการดูรวมหลายกล่อง) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            width: 100%;
            padding: 5px 0;
        }

        @media (min-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .char-card {
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 24px;
            padding: 15px 10px;
            min-height: 155px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 7px 0 #70A1FF;
            transition: transform 0.15s, border-color 0.2s;
            position: relative;
        }

        .char-card:active, .char-card.speaking {
            transform: translateY(4px) scale(1.03);
            border-color: var(--primary);
            background: #FFF5F5;
            box-shadow: 0 3px 0 var(--primary);
        }

        .char-big {
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1.1;
            color: var(--dark);
        }

        .char-big.no-img-mode {
            font-size: 4.8rem;
            margin: 8px 0;
        }

        .char-emoji {
            font-size: 2.6rem;
            margin: 4px 0;
        }

        .char-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2C3E50;
            text-align: center;
        }

        /* Level 3 & 4 Equation Box */
        .blend-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
            margin-top: 5px;
        }

        .equation-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            padding: 18px 12px;
            background: #F8F9FA;
            border-radius: 26px;
            border: 4px dashed #CED6E0;
        }

        .eq-slot {
            min-width: 105px;
            height: 140px;
            padding: 10px 15px;
            background: var(--white);
            border: 5px solid #A4B0BE;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #A4B0BE;
            transition: all 0.25s;
        }

        .eq-slot.consonant-slot { border-color: #FF6B6B; box-shadow: 0 6px 0 #FF6B6B; }
        .eq-slot.vowel-slot { border-color: #4ECDC4; box-shadow: 0 6px 0 #4ECDC4; }
        .eq-slot.result-slot { min-width: 135px; border-color: #FFA502; box-shadow: 0 6px 0 #FFA502; background: #FFFDF0; }

        .eq-slot.highlight {
            transform: scale(1.1) translateY(-5px);
            background: #FFEAA7;
            border-color: #FF4757;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.35);
            z-index: 5;
        }

        .eq-symbol {
            font-size: 2.2rem;
            font-weight: 700;
            color: #747D8C;
        }

        .slot-main-text {
            font-size: 3.6rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .slot-sub-text {
            font-size: 1rem;
            color: #57606F;
            font-weight: 700;
            margin-top: 6px;
            text-align: center;
        }

        .phonetic-banner {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--purple);
            background: #F3E8FF;
            padding: 10px 20px;
            border-radius: 20px;
            border: 3px solid #D8B4FE;
            text-align: center;
            width: 100%;
        }

        .word-nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 22px;
            font-family: 'Mali', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--white);
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .btn-speak-all { background: #2ED573; }
        .btn-next { background: #1E90FF; }
        .btn-prev { background: #747D8C; }

        /* Quiz Mode */
        .quiz-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 20px;
            margin: 5px 0;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-counter {
            background: #ECCC68;
            color: var(--dark);
            padding: 5px 16px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.05rem;
        }

        .sound-prompt-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #FF6B6B;
            border: 5px solid var(--white);
            box-shadow: 0 7px 0 #EE5253, 0 10px 18px rgba(0,0,0,0.15);
            font-size: 3.2rem;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        .quiz-choices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .choice-card {
            width: 145px;
            height: 165px;
            background: var(--white);
            border: 5px solid #70A1FF;
            border-radius: 26px;
            box-shadow: 0 7px 0 #70A1FF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            padding: 10px;
        }

        .choice-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            box-shadow: 0 7px 0 #FF4757;
            animation: shake 0.4s;
        }

        .transition-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 260px;
            gap: 14px;
            animation: fadeIn 0.25s;
        }

        .transition-emoji {
            font-size: 5rem;
            animation: bounce 0.6s infinite;
        }

        .transition-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2ED573;
            text-align: center;
        }

        /* Matching Mode */
        .match-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 16px;
            animation: fadeIn 0.3s;
        }

        .match-columns {
            display: flex;
            justify-content: center;
            gap: 18px;
            width: 100%;
            max-width: 640px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .match-card {
            height: 85px;
            background: var(--white);
            border: 4px solid #70A1FF;
            border-radius: 20px;
            box-shadow: 0 5px 0 #70A1FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            padding: 5px;
            text-align: center;
        }

        .match-card.selected {
            background: #FFEAA7;
            border-color: #FFA502;
            box-shadow: 0 5px 0 #FFA502;
            transform: scale(1.04);
        }

        .match-card.matched {
            background: #7BED9F;
            border-color: #2ED573;
            box-shadow: 0 3px 0 #2ED573;
            opacity: 0.45;
            pointer-events: none;
            transform: scale(0.95);
        }

        .match-card.wrong {
            background: #FF6B81;
            border-color: #FF4757;
            animation: shake 0.4s;
        }

        /* Voice Studio Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--white);
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            border-radius: 26px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #F1F2F6;
            padding-bottom: 10px;
        }

        .modal-body {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .voice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #F8F9FA;
            border-radius: 14px;
            border: 2px solid #DFE4EA;
            flex-wrap: wrap;
            gap: 8px;
        }

        .voice-item-title { font-size: 1.05rem; font-weight: 700; }
        .voice-controls { display: flex; gap: 6px; align-items: center; }

        .rec-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            font-family: 'Mali', sans-serif;
            font-weight: 700;
            cursor: pointer;
            color: var(--white);
            font-size: 0.85rem;
        }

        .rec-btn.record { background: #FF4757; }
        .rec-btn.recording { background: #2ED573; animation: pulse 1s infinite; }
        .rec-btn.play { background: #1E90FF; }
        .rec-btn.delete { background: #747D8C; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <div class="header-top">
            <h1 class="game-title">🎈 พยัญชนะและสระหรรษา</h1>
            <div class="utility-btns">
                <button class="util-btn active-toggle" id="btn-toggle-view" onclick="toggleCardViewMode()">
                    🗂️ ดูทีละใบ
                </button>
                <button class="util-btn active-toggle" id="btn-toggle-img" onclick="toggleImages()">
                    🖼️ แสดงรูปภาพ
                </button>
                <button class="util-btn" onclick="openVoiceStudio()">
                    🎙️ อัดเสียง
                </button>
            </div>
        </div>
        <nav class="level-nav">
            <button class="level-btn btn-lv1 active" onclick="selectLevel(1)">🐣 1. รู้จักพยัญชนะ</button>
            <button class="level-btn btn-lv2" onclick="selectLevel(2)">🌈 2. รู้จักสระ</button>
            <button class="level-btn btn-lv3" onclick="selectLevel(3)">🧩 3. ผสมพยัญชนะ+สระ</button>
            <button class="level-btn btn-lv4" onclick="selectLevel(4)">🚂 4. สะกดคำ (กอ-อา-กา)</button>
        </nav>
    </header>

    <main class="stage-container">
        <div class="top-bar">
            <div class="mode-switch">
                <button class="mode-btn active" id="btn-mode-learn" onclick="setMode('learn')">📖 โหมดเรียนรู้</button>
                <button class="mode-btn" id="btn-mode-match" onclick="setMode('match')">🧩 โหมดจับคู่</button>
                <button class="mode-btn" id="btn-mode-quiz" onclick="setMode('quiz')">🎮 โหมดทายเสียง</button>
            </div>
            <div class="score-box">⭐ ดาวคนเก่ง: <span id="star-count">0</span></div>
        </div>

        <div class="instruction-bar" onclick="repeatInstruction()">
            <span>🔊</span> <span id="instruction-text">แตะที่กล่องบัตรคำ เพื่อฟังเสียงพยัญชนะนะจ๊ะ!</span>
        </div>

        <div id="game-content" style="width: 100%; display: flex; justify-content: center;"></div>
    </main>

    <!-- Modal สตูดิโออัดเสียงผู้ปกครอง -->
    <div class="modal-overlay" id="voice-modal">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <h2 style="margin:0; font-size:1.3rem; color:#FF4757;">🎙️ สตูดิโออัดเสียงผู้ปกครอง</h2>
                    <small style="color:#57606F;">คำไหนที่มีการอัดเสียงไว้ เกมจะใช้เสียงที่อัดแทนเสียง AI อัตโนมัติครับ</small>
                </div>
                <button class="util-btn" onclick="closeVoiceStudio()">❌ ปิด</button>
            </div>
            <div class="modal-body" id="voice-studio-list"></div>
        </div>
    </div>

    <script>
        /* ==================== 1. ข้อมูลบทเรียน ==================== */
        const consonants = [
            { id: 'c_ก', char: 'ก', name: 'กอ ไก่', tts: 'กอ ไก่', sound: 'กอ', emoji: '🐔' },

        /* ==================== 3. ระบบฐานข้อมูลเสียงผู้ปกครอง (IndexedDB) ==================== */
        let db;
        const recordedKeys = new Set();

        function initDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('ThaiKidsVoiceDB', 1);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('voices')) {
                        database.createObjectStore('voices');
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    loadRecordedKeys().then(resolve);
                };
                request.onerror = () => resolve();
            });
        }

        function loadRecordedKeys() {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction('voices', 'readonly');
                const store = tx.objectStore('voices');
                const req = store.getAllKeys();
                req.onsuccess = () => {
                    recordedKeys.clear();
                    req.result.forEach(k => recordedKeys.add(k));
                    resolve();
                };
                req.onerror = () => resolve();
            });
        }

        function saveVoiceBlob(key, blob) {
            return new Promise((resolve) => {
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').put(blob, key);
                tx.oncomplete = () => {
                    recordedKeys.add(key);
                    resolve();
                };
            });
        }

        function getVoiceBlob(key) {
            return new Promise((resolve) => {
                if (!db || !recordedKeys.has(key)) return resolve(null);
                const tx = db.transaction('voices', 'readonly');
                const req = tx.objectStore('voices').get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        function deleteVoiceBlob(key) {
            return new Promise((resolve) => {
                const tx = db.transaction('voices', 'readwrite');
                tx.objectStore('voices').delete(key);
                tx.oncomplete = () => {
                    recordedKeys.delete(key);
                    resolve();
                };
            });
        }

        /* ==================== 4. ระบบเสียงพูด Natural AI + เล่นเสียงอัด ==================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let currentAudioElement = null;
        let speechSessionId = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playTone(freq, type = 'sine', duration = 0.18, delay = 0) {
            initAudio();
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay * 1000);
        }

        function playPopSound() { playTone(520, 'sine', 0.1); }
        function playSuccessSound() {
            playTone(523.25, 'triangle', 0.14, 0);
            playTone(659.25, 'triangle', 0.14, 0.11);
            playTone(783.99, 'triangle', 0.14, 0.22);
            playTone(1046.50, 'triangle', 0.3, 0.33);
        }
        function playWrongSound() {
            playTone(280, 'sawtooth', 0.18, 0);
            playTone(210, 'sawtooth', 0.25, 0.16);
        }

        function stopAllSpeech() {
            speechSessionId++;
            clearAllTimers();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (currentAudioElement) {
                currentAudioElement.pause();
                currentAudioElement = null;
            }
        }

        function getBestThaiVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices();
            const thVoices = voices.filter(v => v.lang.includes('th') || v.lang.includes('TH'));
            if (thVoices.length === 0) return null;

            return thVoices.find(v => v.name.includes('Premwadee') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Niwat') && v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Natural')) ||
                   thVoices.find(v => v.name.includes('Premwadee')) ||
                   thVoices.find(v => v.name.includes('Kanya')) ||
                   thVoices.find(v => v.name.includes('Google')) ||
                   thVoices[0];
        }

        async function speakSmart(voiceKey, ttsText, callback) {
            stopAllSpeech();
            const mySession = speechSessionId;
            let callbackCalled = false;

            const safeCallback = () => {
                if (!callbackCalled && mySession === speechSessionId) {
                    callbackCalled = true;
                    if (callback) callback();
                }
            };

            if (voiceKey && recordedKeys.has(voiceKey)) {
                const blob = await getVoiceBlob(voiceKey);
                if (blob && mySession === speechSessionId) {
                    const url = URL.createObjectURL(blob);
                    const audio = new Audio(url);
                    currentAudioElement = audio;
                    audio.onended = () => {
                        URL.revokeObjectURL(url);
                        safeCallback();
                    };
                    audio.onerror = () => safeCallback();
                    audio.play().catch(() => safeCallback());
                    return;
                }
            }

            if (!('speechSynthesis' in window)) {
                const t = setTimeout(safeCallback, 800);
                activeTimers.push(t);
                return;
            }

            const utter = new SpeechSynthesisUtterance(ttsText);
            utter.lang = 'th-TH';
            utter.rate = 0.92;
            utter.pitch = 1.0;

            const bestVoice = getBestThaiVoice();
            if (bestVoice) utter.voice = bestVoice;

            utter.onend = () => safeCallback();
            utter.onerror = () => safeCallback();

            window.speechSynthesis.speak(utter);
        }

                        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('speaking'));
                        card.classList.add('speaking');
                        speakSmart(item.id, item.tts, () => card.classList.remove('speaking'));
                    };
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        }

        function speakCurrentFlashcard(lv) {
            const box = document.getElementById('main-flashcard');
            if (!box) return;
            box.classList.add('speaking');

            if (lv === 1) {
                const item = consonants[currentConsonantIndex];
                speakSmart(item.id, item.tts, () => box.classList.remove('speaking'));
            } else {
                const item = vowels[currentVowelIndex];
                speakSmart(item.id, item.tts, () => box.classList.remove('speaking'));
            }
        }

        function stepFlashcard(lv, dir) {
            playPopSound();
            stopAllSpeech();
            if (lv === 1) {
                currentConsonantIndex = (currentConsonantIndex + dir + consonants.length) % consonants.length;
            } else {
                currentVowelIndex = (currentVowelIndex + dir + vowels.length) % vowels.length;
            }
            renderStage();
        }

        /* ==================== ด่าน 3 และ 4 (ผสมคำและสะกดคำ) ==================== */
        function renderLevel3And4Learn(container, lv) {
            const item = blendWords[currentWordIndex];
            const voiceKey = lv === 3 ? `${item.id}_lv3` : `${item.id}_lv4`;

            if (lv === 3) {
                setInstruction(
                    'แตะที่กล่องเพื่อฟังเสียงผสมคำ (เช่น กอ ไก่ สระ อา อ่านว่า กอ อา กา)',
                    'แตะที่กล่องเพื่อฟังเสียงผสมคำ เช่น กอ ไก่ สะ-ระ อา อ่านว่า กอ อา กา'
                );
            } else {
                setInstruction(
                    'แตะที่กล่องเพื่อฝึกสะกดคำ (เช่น กอ อา กา)',
                    'แตะที่กล่องเพื่อฝึกสะกดคำ เช่น กอ อา กา'
                );
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'blend-stage';

            const subC = lv === 3 ? item.cName : item.cSound;
            const subV = lv === 3 ? item.vName : item.vSound;
            const bannerText = lv === 3
                ? `${item.cName} + ${item.vName} อ่านว่า "${item.cSound} ${item.vSound} ${item.word}"`
                : `สะกดว่า: "${item.cSound} - ${item.vSound} - ${item.word}"`;

            wrapper.innerHTML = `
                <div class="card-progress">คำที่ ${currentWordIndex + 1} จาก ${blendWords.length}</div>
                <div class="equation-box">
                    <div class="eq-slot consonant-slot" id="slot-c" onclick="speakSinglePart('c')">
                        <div class="slot-main-text" style="color: #FF4757;">${item.c}</div>
                        <div class="slot-sub-text">${subC}</div>
                    </div>
                    <div class="eq-symbol">+</div>
                    <div class="eq-slot vowel-slot" id="slot-v" onclick="speakSinglePart('v')">
                        <div class="slot-main-text" style="color: #00A8FF;">${item.v}</div>
                        <div class="slot-sub-text">${subV}</div>
                    </div>
                    <div class="eq-symbol">=</div>
                    <div class="eq-slot result-slot" id="slot-w" onclick="playBlendEquation()">
                        <div class="slot-main-text" style="color: #2ED573;">${item.word}</div>
                        ${showImages ? `<div class="slot-sub-text">${item.emoji}${item.meaning}</div>` : `<div class="slot-sub-text">${item.word}</div>`}
                    </div>
                </div>

                <div class="phonetic-banner">
                    📢 ${bannerText} ${recordedKeys.has(voiceKey) ? '🎙️' : ''}
                </div>

                <div class="word-nav">
                    <button class="action-btn btn-prev" onclick="changeBlendWord(-1)">⬅️ คำก่อนหน้า</button>
                    <button class="action-btn btn-speak-all" onclick="playBlendEquation()">🔊 ฟังเสียงอ่าน</button>
                    <button class="action-btn btn-next" onclick="changeBlendWord(1)">คำถัดไป ➡️</button>
                </div>
            `;

            container.appendChild(wrapper);
            activeTimers.push(setTimeout(() => playBlendEquation(), 250));
        }

        function speakSinglePart(part) {
            playPopSound();
            const item = blendWords[currentWordIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            const slotW = document.getElementById('slot-w');
            if (!slotC || !slotV || !slotW) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');
            slotW.classList.remove('highlight');

            if (part === 'c') {
                slotC.classList.add('highlight');
                const txt = currentLevel === 3 ? item.cName : item.cSound;
                speakSmart(null, txt, () => slotC.classList.remove('highlight'));
            } else if (part === 'v') {
                slotV.classList.add('highlight');
                const txt = currentLevel === 3 ? item.vTts : item.vSound;
                speakSmart(null, txt, () => slotV.classList.remove('highlight'));
            }
        }

        function playBlendEquation() {
            const item = blendWords[currentWordIndex];
            const slotC = document.getElementById('slot-c');
            const slotV = document.getElementById('slot-v');
            const slotW = document.getElementById('slot-w');
            if (!slotC || !slotV || !slotW) return;

            slotC.classList.remove('highlight');
            slotV.classList.remove('highlight');
            slotW.classList.remove('highlight');

            const voiceKey = currentLevel === 3 ? `${item.id}_lv3` : `${item.id}_lv4`;

            const fullTts = currentLevel === 3
                ? `${item.cName}, ${item.vTts}, อ่านว่า, ${item.cSound} ${item.vSound} ${item.word}`
                : `${item.cSound}, ${item.vSound}, ${item.word}`;

            const t1 = currentLevel === 3 ? 950 : 600;
            const t2 = currentLevel === 3 ? 1950 : 1200;

            slotC.classList.add('highlight');

            speakSmart(voiceKey, fullTts, () => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.remove('highlight');
            });

            activeTimers.push(setTimeout(() => {
                if (slotC) slotC.classList.remove('highlight');
                if (slotV) slotV.classList.add('highlight');
            }, t1));

            activeTimers.push(setTimeout(() => {
                if (slotV) slotV.classList.remove('highlight');
                if (slotW) slotW.classList.add('highlight');
            }, t2));
        }

        function changeBlendWord(dir) {
            playPopSound();
            stopAllSpeech();
            currentWordIndex = (currentWordIndex + dir + blendWords.length) % blendWords.length;
            renderStage();
        }

        /* ==================== 7. โหมดจับคู่ ==================== */
        let selectedLeft = null;
        let selectedRight = null;
        let matchedPairsCount = 0;

        function renderMatchGame(container) {
            selectedLeft = null;
            selectedRight = null;
            matchedPairsCount = 0;

            let pool = [];
            if (currentLevel === 1) {
                setInstruction('🧩 แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ', 'แตะพยัญชนะฝั่งซ้าย แล้วแตะรูปภาพคู่กันฝั่งขวานะจ๊ะ');
                pool = [...consonants].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.char, rightText: x.emoji, ttsLeft: x.sound, ttsMatch: x.tts
                }));
            } else if (currentLevel === 2) {
                setInstruction('🧩 จับคู่รูปสระ กับชื่อสระให้ถูกต้องนะจ๊ะ', 'จับคู่รูปสะ-ระ กับชื่อสะ-ระให้ถูกต้องนะจ๊ะ');
                pool = [...vowels].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id, leftText: x.display, rightText: x.name, ttsLeft: x.sound, ttsMatch: x.tts
                }));
            } else {
                setInstruction('🧩 จับคู่คำอ่าน กับรูปภาพความหมายให้ตรงกันจ้า', 'จับคู่คำอ่าน กับรูปภาพความหมายให้ตรงกันจ้า');
                pool = [...blendWords].sort(() => 0.5 - Math.random()).slice(0, 4).map(x => ({
                    id: x.id,
                    leftText: x.word,
                    rightText: `${x.emoji} ${x.meaning}`,
                    ttsLeft: `${x.cSound} ${x.vSound} ${x.word}`,
                    ttsMatch: `${x.cSound} ${x.vSound} ${x.word}`
                }));
            }

            const leftItems = [...pool].sort(() => 0.5 - Math.random());
            const rightItems = [...pool].sort(() => 0.5 - Math.random());

            const board = document.createElement('div');
            board.className = 'match-board';

            const cols = document.createElement('div');
            cols.className = 'match-columns';

            const colL = document.createElement('div');
            colL.className = 'match-col';
            const colR = document.createElement('div');
            colR.className = 'match-col';

            leftItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerText = item.leftText;
                card.onclick = () => selectMatchCard('left', card, item);
                colL.appendChild(card);
            });

            rightItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.style.fontSize = currentLevel === 1 ? '2.6rem' : '1.25rem';
                card.innerText = item.rightText;
                card.onclick = () => selectMatchCard('right', card, item);
                colR.appendChild(card);
            });

            cols.appendChild(colL);
            cols.appendChild(colR);
            board.appendChild(cols);
            container.appendChild(board);
        }

        function selectMatchCard(side, cardEl, item) {
            playPopSound();
            if (side === 'left') {
                if (selectedLeft) selectedLeft.el.classList.remove('selected');
                selectedLeft = { el: cardEl, item };
                cardEl.classList.add('selected');
                speakSmart(null, item.ttsLeft);
            } else {
                if (selectedRight) selectedRight.el.classList.remove('selected');
                selectedRight = { el: cardEl, item };
                cardEl.classList.add('selected');
            }

            if (selectedLeft && selectedRight) {
                const left = selectedLeft;
                const right = selectedRight;
                selectedLeft = null;
                selectedRight = null;

                if (left.item.id === right.item.id) {
                    left.el.classList.remove('selected');
                    right.el.classList.remove('selected');
                    left.el.classList.add('matched');
                    right.el.classList.add('matched');
                    playSuccessSound();
                    matchedPairsCount++;

                    speakSmart(left.item.id, left.item.ttsMatch, () => {
                        if (matchedPairsCount === 4) {
                            addStar();
                            showTransitionScreen('จับคู่ครบแล้ว เก่งมากจ้า!', () => {
                                renderMatchGame(document.getElementById('game-content'));
                            });
                        }
                    });
                } else {
                    left.el.classList.add('wrong');
                    right.el.classList.add('wrong');
                    playWrongSound();
                    setTimeout(() => {
                        left.el.classList.remove('selected', 'wrong');
                        right.el.classList.remove('selected', 'wrong');
                    }, 500);
                }
            }
        }

        /* ==================== 8. โหมดทายเสียง (ขึ้นทีละข้อ ล้างของเก่าก่อนขึ้นข้อใหม่) ==================== */
        function renderQuiz(container) {
            container.innerHTML = '';

            let pool = [];
            if (currentLevel === 1) pool = consonants;
            else if (currentLevel === 2) pool = vowels;
            else pool = blendWords;

            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            const choices = shuffled.slice(0, 3);
            const answer = choices[Math.floor(Math.random() * choices.length)];

            let displayQuestion = '';
            let ttsQuestion = '';
            let voiceKeyToUse = null;

            if (currentLevel === 1) {
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else if (currentLevel === 2) {
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ตัวไหนคือ "${answer.name}" จ๊ะ?`;
                ttsQuestion = `ตัวไหนคือ ${answer.tts} จ๊ะ`;
                voiceKeyToUse = answer.id;
            } else if (currentLevel === 3) {
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: ${answer.cName} ${answer.vName} อ่านว่า ${answer.cSound} ${answer.vSound} ${answer.word}`;
                ttsQuestion = `${answer.cName}, ${answer.vTts}, อ่านว่า, ${answer.cSound} ${answer.vSound} ${answer.word}`;
                voiceKeyToUse = `${answer.id}_lv3`;
            } else {
                displayQuestion = `ข้อที่ ${quizQuestionNumber}: คำว่า "${answer.cSound} - ${answer.vSound} - ${answer.word}" คือข้อไหนจ๊ะ?`;
                ttsQuestion = `${answer.cSound}, ${answer.vSound}, ${answer.word}`;
                voiceKeyToUse = `${answer.id}_lv4`;
            }

            setInstruction(displayQuestion, ttsQuestion);

            const quizWrapper = document.createElement('div');
            quizWrapper.className = 'quiz-area';

            const counterBadge = document.createElement('div');
            counterBadge.className = 'quiz-counter';
            counterBadge.innerText = `🎯 ข้อที่ ${quizQuestionNumber}`;

            const soundBtn = document.createElement('button');
            soundBtn.className = 'sound-prompt-btn';
            soundBtn.innerHTML = '🔊';
            soundBtn.onclick = () => speakSmart(voiceKeyToUse, ttsQuestion);

            const choicesBox = document.createElement('div');
            choicesBox.className = 'quiz-choices';

            choices.forEach(item => {
                const card = document.createElement('div');
                card.className = 'choice-card';

                if (currentLevel === 1) {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}">${item.char}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                } else if (currentLevel === 2) {
                    card.innerHTML = `
                        <div class="char-big" style="color:#00A8FF;">${item.display}</div>
                        ${showImages ? `<div class="char-label" style="margin-top:8px; font-size:0.95rem;">${item.desc}</div>` : ''}
                    `;
                } else {
                    card.innerHTML = `
                        <div class="char-big ${!showImages ? 'no-img-mode' : ''}" style="color:#2ED573;">${item.word}</div>
                        ${showImages ? `<div class="char-emoji">${item.emoji}</div>` : ''}
                    `;
                }

                card.onclick = () => handleQuizChoice(card, item, answer);
                choicesBox.appendChild(card);
            });

            quizWrapper.appendChild(counterBadge);
            quizWrapper.appendChild(soundBtn);
            quizWrapper.appendChild(choicesBox);
            container.appendChild(quizWrapper);

            activeTimers.push(setTimeout(() => speakSmart(voiceKeyToUse, ttsQuestion), 300));
        }

        function handleQuizChoice(cardEl, selected, answer) {
            if (selected.id === answer.id) {
                playSuccessSound();
                addStar();
                quizQuestionNumber++;
                showTransitionScreen('ถูกต้องจ้า เก่งมากเลย!', () => {
                    renderQuiz(document.getElementById('game-content'));
                });
            } else {
                if (cardEl.classList.contains('wrong')) return;
                cardEl.classList.add('wrong');
                playWrongSound();
                speakSmart(null, 'ลองดูใหม่อีกทีนะจ๊ะ', () => {
                    setTimeout(() => cardEl.classList.remove('wrong'), 400);
                });
            }
        }

        function showTransitionScreen(message, onComplete) {
            const container = document.getElementById('game-content');
            container.innerHTML = `
                <div class="transition-screen">
                    <div class="transition-emoji">🌟🎉🌟</div>
                    <div class="transition-text">${message}</div>
                </div>
            `;
            speakSmart(null, 'เก่งมากจ้า', () => {
                activeTimers.push(setTimeout(onComplete, 450));
            });
        }

        /* ==================== 9. สตูดิโออัดเสียงผู้ปกครอง ==================== */
        let mediaRecorder = null;
        let audioChunks = [];
        let currentlyRecordingKey = null;

        function getAllRecordableItems() {
            const list = [];
            consonants.forEach(c => list.push({ key: c.id, label: `[ด่าน 1] ${c.char} - ${c.name}`, defaultTts: c.tts }));
            vowels.forEach(v => list.push({ key: v.id, label: `[ด่าน 2] ${v.display} - ${v.name}`, defaultTts: v.tts }));
            blendWords.forEach(w => {
                list.push({
                    key: `${w.id}_lv3`,
                    label: `[ด่าน 3] ${w.word} ("${w.cName} ${w.vName} อ่านว่า ${w.cSound} ${w.vSound} ${w.word}")`,
                    defaultTts: `${w.cName}, ${w.vTts}, อ่านว่า, ${w.cSound} ${w.vSound} ${w.word}`
                });
                list.push({
                    key: `${w.id}_lv4`,
                    label: `[ด่าน 4] ${w.word} ("${w.cSound} ${w.vSound} ${w.word}")`,
                    defaultTts: `${w.cSound}, ${w.vSound}, ${w.word}`
                });
            });
            return list;
        }

        function openVoiceStudio() {
            stopAllSpeech();
            document.getElementById('voice-modal').classList.add('show');
            renderVoiceStudioList();
        }

        function closeVoiceStudio() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            document.getElementById('voice-modal').classList.remove('show');
            renderStage();
        }

        function renderVoiceStudioList() {
            const listEl = document.getElementById('voice-studio-list');
            listEl.innerHTML = '';
            const items = getAllRecordableItems();

            items.forEach(item => {
                const hasRecorded = recordedKeys.has(item.key);
                const isRec = currentlyRecordingKey === item.key;

                const row = document.createElement('div');
                row.className = 'voice-item';
                row.innerHTML = `
                    <div class="voice-item-title">
                        ${hasRecorded ? '✅' : '⚪'} ${item.label}
                    </div>
                    <div class="voice-controls">
                        <button class="rec-btn ${isRec ? 'recording' : 'record'}" onclick="toggleRecord('${item.key}')">
                            ${isRec ? '⏹️ หยุดอัด' : '🎙️ อัดเสียง'}
                        </button>
                        <button class="rec-btn play" onclick="speakSmart('${item.key}', '${item.defaultTts}')">
                            🔊 ฟัง
                        </button>
                        ${hasRecorded ? `<button class="rec-btn delete" onclick="removeRecording('${item.key}')">🗑️ ลบ</button>` : ''}
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        async function toggleRecord(key) {
            if (currentlyRecordingKey === key && mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                currentlyRecordingKey = key;
                renderVoiceStudioList();

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    await saveVoiceBlob(key, blob);
                    stream.getTracks().forEach(t => t.stop());
                    currentlyRecordingKey = null;
                    renderVoiceStudioList();
                };

                mediaRecorder.start();
            } catch (err) {
                alert('ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตการใช้ไมโครโฟนบนเบราว์เซอร์ครับ');
                currentlyRecordingKey = null;
                renderVoiceStudioList();
            }
        }

        async function removeRecording(key) {
            await deleteVoiceBlob(key);
            renderVoiceStudioList();
        }

        /* ==================== 10. พลุกระดาษ (CONFETTI) ==================== */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchConfetti() {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#9B5DE5', '#00BBF9', '#2ED573'];
            for (let i = 0; i < 60; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.8) * 18 - 4,
                    size: Math.random() * 10 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45;
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) confettiParticles.splice(index, 1);
            });

            if (confettiParticles.length > 0) {
                requestAnimationFrame(updateConfetti);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { getBestThaiVoice(); };
        }

        window.onload = async () => {
            await initDB();
            renderStage();
        };
    </script>
</body>
